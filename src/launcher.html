  // The setup Play makes on a fresh install: the latest release, vanilla, the usual memory.
  function firstProfileBody(mc, taken) {
    return { name: autoName(mc, 'vanilla', taken), mc, loader: 'vanilla', memory: defaultMemory('vanilla') }
  }

  async function firstPlay() {
    const mc = latestRelease()
    // a machine Minecraft cannot run on gets no setup made for it, whichever button asked
    if (!mc || S.firstRun || S.summary?.machineRefusal) return
    S.firstRun = true
    S.menu = null
    render()
    let made = null
    try {
      made = await api('client/profiles', { method: 'POST', body: firstProfileBody(mc, profilesNow().map((q) => q.name)) })
    } catch (err) {
      if (err instanceof PanelDown) { S.down = true; S.downWhy = null }
      S.flash = { tone: 'fault', title: 'Couldn\'t make a setup', text: sentence(err.message) }
    }
    S.firstRun = false
    if (!made) return render()
    // where Join pointed carries over to the setup it was for
    if (S.targets[FIRST]) S.targets[made.name] = S.targets[FIRST]
    delete S.targets[FIRST]
    saveTargets()
    pickProfile(made.name)
    await refresh()
    const p = profileNamed(made.name)
    if (p) startLaunch(p)
  }

  // "Who's playing?": asked when a setup has no account of its own and nobody signs in here.
  function askMenu(p) {
    const o = S.offline
    return h('div', { class: 'menu ask', id: 'menuAsk', role: 'dialog', 'aria-label': 'Who\'s playing?', onkeydown: menuKeys },
      h('div', { class: 'mhead', text: 'Who\'s playing?' }),
      S.acctNotice && acctNotice(S.acctNotice),
      S.login ? waitingStrip(S.login) : h('button', { class: 'primary', style: 'width:100%;min-height:36px', onclick: () => { S.afterLogin = p.name; startLogin() } }, ico('ext'), 'Sign in with Microsoft'),
      h('p', { class: 'note', text: 'Opens Microsoft\'s own sign-in page. SpawnLoft never sees your password. Needed for online servers.' }),
      h('hr'),
      h('div', { class: 'mhead', text: 'Or play offline on local servers' }),
      offlineField('askName', 'Play', () => addOffline(p.name)))
  }

  function flashNotice() {
    return S.flash && notice({ ...S.flash, onclose: () => { S.flash = null; render() } })
  }

  // What Play would do for a profile right now, and whether it may.
  function launchPlan(p) {
    const acct = playAccount(p, accountsNow(), S.summary.defaultAccount)
    const t = targetFor(p)
    const choices = serverChoices(p, serversNow(), acct.type)
    const picked = t.server ? choices.find((c) => c.name === t.server) ?? null : null
    // a server that is gone falls back to the title screen
    if (t.server && !picked) t.server = null
    // "Another address" is a choice of its own: until an address is typed, Play has nowhere to go
    const custom = !picked && (t.custom || Boolean(t.address.trim()))
    const address = custom ? t.address.trim() : ''
    const addrProblem = custom ? addressProblem(address) : null
    const job = S.job?.profile === p.name ? S.job : null
    const refused = S.refusals[p.name]
    if (refused && refused.mc !== p.mc) delete S.refusals[p.name]
    const state = playState({
      down: S.down, loaded: true, profile: p, job, acct, picked, anyway: t.anyway,
      machineRefusal: S.summary.machineRefusal,
      busy: Boolean(S.notice?.busy && S.notice.profile === p.name),
      otherJob: Boolean(S.job && !job),
      refusal: S.refusals[p.name]?.message ?? null,
      crashed: S.crash?.profile === p.name && !S.crash.pending,
    })
    // a server Play will not go to is not started for it
    const startsServer = Boolean(picked?.stopped) && !(picked.otherVersion && t.anyway !== picked.name)
    const who = acct.missing ? `${acct.name} (no longer signed in)` : acct.name
    const sentenceParts = custom && addrProblem
      ? [address ? 'Fix the server address under Join, or pick another place to join.' : 'Type a server address under Join, or pick another place to join.']
      : playSentence({ mc: p.mc, fabric: p.loader === 'fabric', who, server: picked?.name, address, startsServer })
    return { state, acct, t, choices, picked, custom, address, addrProblem, startsServer, blocked: state.kind !== 'ready' && state.kind !== 'closed-early', sentence: sentenceParts }
  }

  function playButton(p, plan) {
    const label = plan.startsServer ? 'Start server and play' : plan.state.kind === 'closed-early' ? 'Play again' : 'Play'
    return h('div', { class: 'playrow menuhost', 'data-menu': 'ask' },
      h('button', { class: 'primary play', id: 'play', disabled: plan.blocked, 'aria-describedby': plan.blocked ? 'why' : 'does', onclick: () => { S.askFrom = null; startLaunch(p) } }, ico('play'), label),
      h('button', { class: 'edit', id: 'editSetup', onclick: () => openSheet(p) }, ico('gear'), 'Edit setup'),
      S.menu === 'ask' && menuPad(askMenu(p)))
  }

  // The square at the start of a setup's row: its version as far as the minor ("1.21"), or the
  // whole id when it is not a release.
  function setupBadge(q) {
    const m = /^(\d+\.\d+)(?:\.\d+)?$/.exec(String(q.mc))
    return m ? m[1] : String(q.mc).slice(0, 5).replace(/[-. _]+$/, '')
  }

  function setupSub(q) {
    // a named setup says what it is; a second unnamed one of the same version shows its saved
    // name ("1-21-11-2"), which is all that tells the two apart
    const what = givenName(q) ? setupTitle(q) : String(q.name).toLowerCase() !== nameBase(q.mc, q.loader).toLowerCase() ? q.name : null
    return [what, q.played?.lastPlayedAt ? `played ${dayWords(q.played.lastPlayedAt)}` : 'not played yet'].filter(Boolean).join(' · ')
  }

  // The setups, always in view beside the card. Picking one changes the card; the gear opens its
  // sheet (edit, rename, duplicate, remove). Each control has an id, so a re-render keeps focus.
  function setupsPanel(p) {
    const list = profilesNow()
    return h('aside', { class: 'setups', id: 'setups', 'aria-labelledby': 'setupsTitle' },
      h('div', { class: 'shead' },
        h('h2', { class: 'label', id: 'setupsTitle', text: 'Setups' }),
        h('button', { class: 'sm', id: 'newSetup', title: 'Any version, snapshots too', 'aria-label': 'New setup', onclick: () => openSheet() }, ico('plus'), 'New')),
      !list.length && h('p', { class: 'note', text: 'No setups yet. Play makes one for the latest release, or make your own with New.' }),
      list.length > 0 && h('ul', { class: 'slist', role: 'list' }, list.map((q) => h('li', { class: q === p ? 'srow cur' : 'srow' },
        h('button', { class: 'pick', id: `setup-${q.name}`, 'aria-current': q === p ? 'true' : null, onclick: () => { pickProfile(q.name); S.menu = null; render() } },
          h('span', { class: 'badge', 'aria-hidden': 'true', text: setupBadge(q) }),
          h('span', { class: 'sub' }, h('b', { text: setupName(q) }), h('small', { text: setupSub(q) })),
          q.running ? pill('live', 'running', true) : S.job?.profile === q.name ? pill('accent', 'launching', true) : null),
        h('button', { class: 'sm quiet icon', id: `edit-${q.name}`, title: `Edit ${setupTitle(q)}${givenName(q) ? ` (${givenName(q)})` : ''}`, 'aria-label': `Edit ${setupTitle(q)}${givenName(q) ? ` (${givenName(q)})` : ''}`, onclick: () => openSheet(q) }, ico('gear'))))),
      list.length > 0 && h('p', { class: 'note', text: 'A setup keeps its own worlds, options and mods. The gear edits, renames or copies it.' }))
  }

  // Which of your servers the page shows: those on the setup's version, or all of them, narrowed
  // by what was typed (a name, a label or a version).
  function shownServers(choices, opts) {
    const all = opts?.all === true
    const q = String(opts?.find ?? '').trim().toLowerCase()
    return choices.filter((c) => (all || !c.otherVersion) && (!q || [c.name, c.label, c.mc].some((v) => String(v ?? '').toLowerCase().includes(q))))
  }

  // Past this many servers the row gets a box to find one in.
  const FIND_FROM = 7

  // Your servers, under the card. Someone with a test server for every Minecraft version sees the
  // ones this setup can join; the rest are one press away, each offering a setup of its version.
  function serversRow(p, plan) {
    const all = plan.choices
    if (!all.length) return null
    const others = all.filter((c) => c.otherVersion).length
    // the box is there from seven servers up; what was typed counts only while it is
    const find = all.length >= FIND_FROM ? S.serverFind.trim() : ''
    // the first run's draft has no version until Mojang's list is read: nothing to narrow by yet;
    // and a search looks through every server, whatever the version
    const wide = S.serversAll || p.mc === 'latest' || Boolean(find)
    const shown = shownServers(all, { all: wide, find })
    const busy = plan.state.kind === 'launching' || plan.state.kind === 'running' || Boolean(S.job) || Boolean(S.firstRun)
    const stuck = cardsBlocked(plan, S.summary.machineRefusal)
    const card = (c) => {
      const cur = plan.picked?.name === c.name
      const act = c.otherVersion
        ? h('button', { class: 'sm', id: `srv-${c.name}`, disabled: Boolean(S.firstRun), onclick: () => { S.menu = null; takePrefill({ mc: c.otherVersion, server: c.name }) } }, `Use a ${c.otherVersion} setup`)
        : c.blocked
          ? h('small', { text: sentence(c.blocked) })
          : h('button', { class: 'sm', id: `srv-${c.name}`, disabled: busy || stuck, title: stuck && !busy ? 'Play can\'t start yet: the card above says why.' : null, onclick: () => playOn(p, c) }, ico('play'), c.stopped ? 'Start and play' : 'Play here')
      return h('li', { class: cur ? 'scard cur' : 'scard', 'aria-current': cur ? 'true' : null },
        h('span', { class: 'nm' }, h('span', { class: `dot ${c.status === 'running' ? 'live' : c.stopped ? 'idle' : 'warn'}` }), h('b', { title: c.label && c.label !== c.name ? `${c.label} (folder name: ${c.name})` : c.name, text: c.label || c.name })),
        h('small', { text: `${c.mc ?? 'version unknown'} · ${statusText(c.status).toLowerCase()}` }),
        act)
    }
    return h('section', { class: 'servers', 'aria-labelledby': 'serversTitle' },
      h('div', { class: 'shead' },
        h('h2', { class: 'label', id: 'serversTitle', text: wide ? 'Your servers' : `Your servers on ${p.mc}` }),
        all.length >= FIND_FROM && h('input', { class: 'find', id: 'serverFind', type: 'search', 'aria-label': 'Find a server', placeholder: 'Find a server', value: S.serverFind, autocomplete: 'off', spellcheck: 'false', oninput: (e) => { S.serverFind = e.target.value; S.menu = null; render() } }),
        // the label says what a press does; it is not a pressed/unpressed toggle
        others > 0 && p.mc !== 'latest' && !find && h('button', { class: 'linkbtn', id: 'serversAll', onclick: () => { S.serversAll = !S.serversAll; S.menu = null; render() } }, S.serversAll ? `Only ${p.mc}` : `Show all ${all.length}`)),
      shown.length
        ? h('ul', { class: 'scards', role: 'list' }, shown.map(card))
        : h('p', { class: 'note', text: find ? `No server matches \u201c${find}\u201d.` : `None of your servers run Minecraft ${p.mc}.${wide ? '' : ' Show all to see the others.'}` }))
  }

  // Whether a server card's Play would go nowhere whichever server it is for: Play is blocked,
  // and not by the server now picked (picking another is what the card does).
  function cardsBlocked(plan, machineRefusal) {
    if (machineRefusal) return true
    return plan.state.kind === 'blocked' && !(plan.picked && (plan.picked.blocked || plan.picked.otherVersion))
  }

  // A server card's own Play: this setup, joined to that server, now. Focus follows to what the
  // press brought up (Cancel on the launch, or the question of who is playing), since the button
  // pressed is disabled the moment the launch starts.
  function playOn(p, c) {
    S.menu = null
    S.askFrom = `srv-${c.name}`
    setTarget(p, { server: c.name })
    startLaunch(p)
    if (S.menu !== 'ask') (document.activeElement?.id ? null : $('cancelLaunch') ?? $('play'))?.focus({ preventScroll: true })
  }

  // Join is one choice out of a short list: a SpawnLoft server on the setup's version, another
  // address (typed in a box of its own under the field), or the title screen. The field is a
  // button that says which, so nothing typed can turn a picked server into an address.
  function joinField(p, plan, inert) {
    const { t, picked, custom, address, addrProblem, acct } = plan
    const open = S.menu === 'join' && !inert
    const dot = picked && h('span', { class: `dot ${picked.status === 'running' ? 'live' : picked.stopped ? 'idle' : 'warn'}` })
    const now = picked ? picked.label || picked.name : custom ? 'Another address' : 'Title screen'
    const hint = picked ? `${statusText(picked.status)}${picked.mc ? ` \u00b7 ${picked.mc}` : ''}` : custom ? null : 'no server'
    return h('div', { class: 'join' },
      h('span', { class: 'label', id: 'joinLabel', text: 'Join' }),
      h('div', { class: 'menuhost', 'data-menu': 'join' },
        h('button', {
          class: 'joinbox', id: 'join', 'aria-haspopup': 'dialog', 'aria-expanded': String(open), 'aria-controls': 'menuJoin', 'aria-labelledby': 'joinLabel joinNow', 'aria-describedby': hint ? 'joinHint' : null, disabled: inert,
          onclick: toggleMenu('join'),
          onkeydown: (e) => { if (e.key === 'ArrowDown' && !open) { e.preventDefault(); openMenu('join') } },
        }, dot, h('span', { class: 'now', id: 'joinNow', text: now }), hint && h('span', { class: 'hint', id: 'joinHint', text: hint }), h('span', { class: 'chev', 'aria-hidden': 'true' }, ico('chev'))),
        open && menuPad(joinMenu(p, plan))),
      custom && h('div', { class: 'addr' },
        h('input', {
          id: 'joinAddress', 'aria-label': 'Server address', 'aria-describedby': 'joinAddressHint', autocomplete: 'off', spellcheck: 'false', disabled: inert,
          class: address && addrProblem ? 'bad' : null, placeholder: 'play.example.net or 192.168.1.20:25566', value: t.address, maxlength: '260',
          oninput: (e) => { setTarget(p, { address: e.target.value, custom: true }); S.menu = null; render() },
          onkeydown: (e) => { if (e.key === 'Enter' && !plan.blocked) { e.preventDefault(); startLaunch(p) } },
        }),
        h('small', { id: 'joinAddressHint', class: address && addrProblem ? 'hint bad' : 'hint', text: address && addrProblem ? addrProblem : `Host, or host:port. Online servers need a Microsoft account${acct.type === 'microsoft' ? `; you are signed in as ${acct.name}` : ''}.` })))
  }

  // The servers Join offers a setup: the ones on its version (and the one picked now, whatever
  // it runs), those that are up first. The first run's draft has no version to narrow by yet.
  function joinChoices(choices, mc, current) {
    const fits = choices.filter((c) => mc === 'latest' || !c.otherVersion || c.name === current)
    return [...fits.filter((c) => c.status === 'running'), ...fits.filter((c) => c.status !== 'running')]
  }

  function joinMenu(p, plan) {
    const { t, choices, custom } = plan
    const title = !t.server && !custom
    const list = joinChoices(choices, p.mc, t.server)
    const rest = choices.length - list.length
    const pickServer = (c) => () => { setTarget(p, { server: c.name }); closeMenu({ refocus: true }) }
    return h('div', { class: 'menu srv', id: 'menuJoin', role: 'dialog', 'aria-label': 'Where to join', onkeydown: menuKeys },
      list.length
        ? h('div', { class: 'mhead', text: p.mc === 'latest' ? 'Your servers' : `Your servers on ${p.mc}` })
        : h('p', { class: 'note', text: choices.length ? `None of your servers run Minecraft ${p.mc}.` : 'No SpawnLoft servers yet.' }),
      list.map((c) => {
        let meta = c.status === 'running' ? 'joins right away' : c.stopped ? 'starts it first, up to 2 min' : statusText(c.status)
        let warn = false
        if (c.blocked) { meta = c.blocked; warn = true } else if (c.otherVersion && p.mc !== 'latest') { meta = 'runs another version'; warn = true }
        return h('button', { class: c.name === t.server ? 'row cur' : 'row', 'aria-current': c.name === t.server ? 'true' : null, disabled: Boolean(c.blocked) && c.name !== t.server, onclick: pickServer(c) },
          h('span', { class: `dot ${c.status === 'running' ? 'live' : c.stopped ? 'idle' : 'warn'}` }),
          h('span', { class: 'sub' }, h('b', { title: c.label && c.label !== c.name ? `Folder name: ${c.name}` : null, text: c.label || c.name }), h('small', { text: `${statusText(c.status)}${c.mc ? ` \u00b7 ${c.mc}` : ''}` })),
          h('span', { class: warn ? 'meta warn' : 'meta', text: meta }))
      }),
      rest > 0 && h('p', { class: 'note', text: `${rest} more on other versions. They are under Your servers, with Show all.` }),
      h('hr'),
      h('button', { class: custom ? 'row act cur' : 'row act', id: 'joinOther', 'aria-current': custom ? 'true' : null, onclick: () => { setTarget(p, { address: t.address, custom: true }); closeMenu(); $('joinAddress')?.focus() } }, 'Another address\u2026'),
      h('button', { class: title ? 'row act cur' : 'row act', id: 'joinTitle', 'aria-current': title ? 'true' : null, onclick: () => { setTarget(p, {}); closeMenu({ refocus: true }) } }, 'Title screen'))
  }

  function launchingCard(p, job) {
    const [headline, facts] = splitMessage(job.message || 'Preparing…')
    const shown = STEPS.map((name, i) => ({ name, i })).filter((s) => s.name !== 'Server' || job.startsServer)
    return [
      h('div', { class: 'eyebrow' }, pill('accent', 'Launching', true)),
      h('div', { class: 'prog', 'aria-live': 'polite' },
        h('div', { class: 'line' }, h('b', { text: stepOf(job.stage) === -1 && !job.message ? 'Preparing…' : headline }), facts && h('span', { class: 'hint', text: facts })),
        h('div', { class: job.percent === null || job.percent === undefined ? 'bar indet' : 'bar', role: 'progressbar', 'aria-valuemin': '0', 'aria-valuemax': '100', 'aria-valuenow': job.percent ?? null },
          h('i', { style: job.percent === null || job.percent === undefined ? null : `width:${Math.max(2, job.percent)}%` })),
        h('div', { class: 'steps' }, shown.map((s) => {
          const now = stepOf(job.stage)
          if (s.i < now || (s.i <= job.reached && s.i !== now)) return h('span', { class: 'step done' }, ico('check'), s.name)
          if (s.i === now) return h('span', { class: 'step now' }, '● ' + s.name)
          return h('span', { class: 'step' }, s.name)
        })),
        // the one thing to do while it runs; once the game itself is starting there is nothing left to cancel
        h('div', { class: 'runrow' },
          h('button', { id: 'cancelLaunch', disabled: Boolean(job.cancelling) || stepOf(job.stage) >= 4, onclick: () => cancelLaunch(job) }, job.cancelling ? 'Cancelling…' : 'Cancel')),
        h('p', { class: 'hint', text: `${CLOSING} does not stop the download. It keeps going and the files are used next time. Cancel stops it; what is already downloaded is kept.` })),
    ]
  }

  // Asks the panel to stop the launch. The job's own stream then says it was cancelled, and that
  // is what puts Play back; a launch that had already finished just carries on to its result.
  async function cancelLaunch(job) {
    if (job.done || job.cancelling) return
    job.cancelling = true
    render()
    try {
      const out = await api(`jobs/${enc(job.id)}/cancel`, { method: 'POST', body: {} })
      if (!out?.cancelling && !job.done) { job.cancelling = false; render() }
    } catch (err) {
      if (job.done) return
      job.cancelling = false
      S.flash = null
      S.notice = { profile: job.profile, tone: 'fault', title: 'Could not cancel', text: sentence(plain(err.message)) }
      render()
    }
  }

  /** What the page says after a launch was cancelled. */
  function cancelledNotice(job) {
    const started = job.startsServer && job.reached >= 3
    return { tone: '', title: 'Launch cancelled', text: 'The game was not started. What was downloaded is kept for next time.' + (started ? ' Its server had already been asked to start, and is left to.' : '') }
  }

  function runningCard(p) {
    const target = p.launchTarget
    const started = Date.parse(p.startedAt)
    const total = playedWords((p.played?.totalMs ?? 0) + (Number.isFinite(started) ? Math.max(0, Date.now() - started) : 0))
    const facts = [
      h('span', {}, 'since ', h('b', { text: clockTime(p.startedAt) })),
      Number.isFinite(started) && h('span', {}, 'for ', h('b', { text: playingFor(Date.now() - started) })),
      p.runningAccount?.name && h('span', {}, 'as ', h('b', { text: p.runningAccount.name })),
      total && h('span', {}, h('b', { text: total }), ' in all'),
    ]
    const asking = S.stopAsk === p.name && S.stopping !== p.name
    const live = S.live?.profile === p.name ? S.live : null
    return [
      h('div', { class: 'eyebrow' }, pill('live', 'Running', true), p.launchedBy === 'assistant' && pill('accent', 'Launched by an assistant')),
      h('div', { class: 'prog' },
        h('div', { class: 'line' }, h('b', { text: 'Minecraft is running' }), h('span', { class: 'hint' }, target ? ['joined ', h('b', { style: 'color:var(--ink-2)', text: target })] : 'on the title screen')),
        asking
          // Stop closes the game where it stands; asked first, with the safe choice in focus
          ? h('div', { class: 'confirm', role: 'group', 'aria-label': 'Stop the game?' },
            h('p', { id: 'stopWhy', text: target ? 'Stop Minecraft now? It closes straight away.' : 'Stop Minecraft now? If a single-player world is open, quit from the game\'s own menu instead, so the world is saved first.' }),
            h('button', { id: 'keepPlaying', onclick: () => { S.stopAsk = null; render(); $('stop')?.focus({ preventScroll: true }) } }, 'Keep playing'),
            h('button', { class: 'danger', id: 'stopNow', 'aria-describedby': 'stopWhy', onclick: () => stopProfile(p) }, ico('stop'), 'Stop now'))
          : h('div', { class: 'runrow' },
            // not `disabled` while stopping: the button holds the focus "Stop now" had
            h('button', { class: 'danger stop', id: 'stop', 'aria-disabled': S.stopping === p.name ? 'true' : null, onclick: () => { if (S.stopping !== p.name) askStop(p) } }, ico('stop'), S.stopping === p.name ? 'Stopping\u2026' : 'Stop'),
            h('button', { id: 'liveLog', 'aria-expanded': String(Boolean(live)), 'aria-controls': live ? 'liveLogBox' : null, onclick: () => toggleLive(p) }, live ? 'Hide log' : 'Show log'),
            h('button', { id: 'openFolder', onclick: () => reveal(p, 'folder') }, ico('folder'), 'Open folder')),
        h('div', { class: 'facts' }, facts),
        live && h('div', { class: 'livelog', id: 'liveLogBox' },
          logBlock(live.lines, { id: 'liveLogPre', label: 'The game\'s log, as it runs', empty: live.read ? 'Nothing in the log yet.' : 'Reading the log\u2026' }),
          h('div', { class: 'acts' },
            h('button', { class: 'sm', id: 'copyLive', disabled: !live.lines.length, onclick: () => copyLines('live', live.lines) }, S.copied === 'live' ? 'Copied' : 'Copy'),
            h('button', { class: 'sm', id: 'liveFolder', onclick: () => reveal(p, 'logs') }, 'Open log folder'))),
        h('p', { class: 'hint', text: `${CLOSING} does not stop the game.` })),
    ]
  }

  // A game that ended without a Stop from here and was not simply closed. The panel's record of
  // the exit, when it has one, says how it ended; the log's last lines say why, as far as anything does.
  function crashNotice(crash) {
    const rec = crash.exit
    const p = profileNamed(crash.profile)
    const all = S.log.profile === crash.profile ? S.log.lines : []
    const lines = S.logMore ? all : all.slice(-LOG_LINES)
    const how = exitWords(rec, rec && clockTime(rec.endedAt))
    let text = `${how ? `${how} ` : ''}It was not stopped from here. Usually a mod, not enough memory, or the wrong Java. The last lines of its log:`
    if (crash.report && typeof crash.report === 'object') {
      text = crash.report.error ? `The report could not be made: ${crash.report.error}` : `Saved the report to ${crash.report.file} (${crash.report.sizeHuman}). Attach it to the bug report.`
    }
    const acts = [h('button', { class: 'sm', id: 'crashReport', disabled: crash.report === 'busy', onclick: () => reportProblem(crash) }, crash.report === 'busy' ? 'Collecting\u2026' : 'Report a problem')]
    const pre = logBlock(lines, { id: 'crashLogPre' })
    if (S.logMore) pre.classList.add('more')
    const logActs = h('div', { class: 'logacts' },
      h('button', { class: 'sm', id: 'copyCrash', disabled: !all.length, onclick: () => copyLines('crash', all) }, S.copied === 'crash' ? 'Copied' : 'Copy log'),
      all.length > LOG_LINES && h('button', { class: 'sm', id: 'crashMore', 'aria-expanded': String(S.logMore), 'aria-controls': 'crashLogPre', onclick: () => { S.logMore = !S.logMore; render() } }, S.logMore ? 'Show less' : `Show ${all.length} lines`),
      p && h('button', { class: 'sm', id: 'crashFolder', onclick: () => reveal(p, 'crash-reports') }, 'Show crash reports'),
      p && h('button', { class: 'sm', id: 'crashLogs', onclick: () => reveal(p, 'logs') }, 'Open log folder'))
    const title = `Minecraft ${rec && exitKind(rec) === 'abnormal' ? 'crashed' : 'closed'} ${ranFor(crash.seconds)} after it started`
    return notice({ tone: 'fault', title, text, acts, extra: [pre, logActs], onclose: () => { dropCrash(); nextExit(); render() } })
  }

  // Another setup's game crashed: said on the card in view, since the notice itself sits on its
  // own setup's card and would otherwise wait there unseen.
  function crashElsewhere(crash) {
    const q = profileNamed(crash.profile)
    return notice({ tone: 'fault', title: `Minecraft crashed in ${setupName(q)}`, text: 'Its log is on that setup\'s card.',
      acts: [h('button', { class: 'sm', id: 'crashShow', onclick: () => { pickProfile(crash.profile); render(); $('crashLogPre')?.focus({ preventScroll: true }) } }, 'Show')],
      onclose: () => { dropCrash(); nextExit(); render() } })
  }

  // The crash notice is done with: dismissed, or its game is being played again. What the panel
  // recorded is marked as shown there, so neither a reload nor the app's next start brings it back.
  function dropCrash() {
    seenExit(S.crash)
    S.crash = null
    S.logMore = false
  }

  // The mark is kept by the panel, with the record: the desktop app's page gets a new address at
  // every start, so nothing it stores itself is still there the next time. S.seenExits covers the
  // moment until the panel's answer carries the mark.
  function seenExit(c) {
    if (!c?.exit?.endedAt) return
    S.seenExits[c.profile] = c.exit.endedAt
    api(`client/profiles/${enc(c.profile)}/exit-seen`, { method: 'POST', body: { endedAt: c.exit.endedAt } }).catch(() => { /* it is told again after a reload, no worse */ })
  }

  // Lines to the clipboard, and the button says so for a moment.
  async function copyLines(what, lines) {
    const text = lines.join('\n')
    let ok = false
    try { await navigator.clipboard.writeText(text); ok = true } catch { /* no clipboard here: the old way */ }
    if (!ok) {
      const box = h('textarea', { style: 'position:fixed;left:-999px;top:0', 'aria-hidden': 'true' })
      box.value = text
      document.body.append(box)
      box.select()
      try { ok = document.execCommand('copy') } catch { /* nothing more to try */ }
      box.remove()
    }
    const back = () => $(what === 'live' ? 'copyLive' : 'copyCrash')?.focus({ preventScroll: true })
    if (!ok) {
      S.flash = { tone: 'warn', title: 'Could not copy', text: 'Select the lines and copy them by hand.' }
      render()
      return back()
    }
    S.copied = what
    render()
    back()
    setTimeout(() => { if (S.copied === what) { S.copied = null; render() } }, 2000)
  }

  function logBlock(lines, { id = null, label = 'The last lines of the game log', empty = 'The game left no log lines.' } = {}) {
    const pre = h('pre', { class: 'log', id, tabindex: '0', 'aria-label': label })
    lines.forEach((line, i) => {
      if (i) pre.append('\n')
      const m = LEVEL_RE.exec(line)
      if (!m) {
        pre.append(line)
        return
      }
      pre.append(line.slice(0, m.index), h('span', { class: m[1] === 'WARN' ? 'w' : 'e', text: m[1] }), line.slice(m.index + m[1].length))
    })
    if (!lines.length) pre.append(empty)
    return pre
  }

  // ---- launching -----------------------------------------------------------------------------

  async function startLaunch(p) {
    if (!S.summary) return render()
    // the fresh-install draft is not a setup yet: Play there makes one first
    if (p.name === FIRST) return firstPlay()
    const plan = launchPlan(p)
    if (plan.blocked) return render()
    if (plan.addrProblem) {
      render()
      return ($('joinAddress') ?? $('join'))?.focus()
    }
    if (!p.account && !defaultAccount()) {
      S.acctNotice = null
      return openMenu('ask')
    }
    const body = { jobId: newId() }
    if (plan.picked) {
      body.server = plan.picked.name
      if (plan.startsServer) body.startServer = true
    } else if (plan.address) {
      body.address = plan.address
    } else {
      body.server = false
    }
    // only this setup's crash is done with by playing it again
    if (S.crash?.profile === p.name) dropCrash()
    S.notice = null
    S.flash = null
    S.menu = null
    pickProfile(p.name)
    const job = { id: body.jobId, profile: p.name, stage: 'start', message: '', percent: null, reached: -1, startsServer: plan.startsServer, done: false }
    S.job = job
    stored('session', JOB_KEY, JSON.stringify({ id: job.id, profile: p.name, startsServer: plan.startsServer }))
    followJob(job, () => api(`client/profiles/${enc(p.name)}/launch`, { method: 'POST', body }))
    render()
  }

  // The stream first, then the POST: the stream replays the job's state when it opens, so the
  // page hears every event of a launch it started. `start` is null when picking up a launch this
  // tab started before a reload.
  function followJob(job, start) {
    const es = new EventSource(`/api/jobs/${enc(job.id)}/stream`)
    job.es = es
    let first = true
    es.onmessage = (e) => {
      let ev
      try { ev = JSON.parse(e.data) } catch { return }
      if (S.job !== job) return es.close()
      // The panel answers a job id it does not know with a blank start: after a restart (the
      // stream reconnects by itself) or for a launch picked up after a reload.
      const blank = ev.stage === 'start' && !ev.message
      if (first) {
        first = false
        if (start) {
          start().catch((err) => finishJob(job, { stage: 'error', done: true, message: err.message }))
        } else if (blank) {
          finishJob(job, null)
          return
        }
      } else if (blank && job.message) {
        finishJob(job, { stage: 'error', done: true, message: 'the panel restarted during the launch; check the setup, then play again' })
        return
      }
      job.stage = ev.stage
      job.message = ev.message
      if (ev.cancelling) job.cancelling = true
      job.percent = ev.percent ?? null
      job.reached = Math.max(job.reached, stepOf(ev.stage))
      if (ev.done) finishJob(job, ev)
      else render()
    }
    es.onerror = () => {
      if (!job.done && es.readyState === EventSource.CLOSED) finishJob(job, { stage: 'error', done: true, message: 'lost the connection to the panel; the launch may still be running' })
    }
  }

  function finishJob(job, ev) {
    if (job.done) return
    job.done = true
    job.es?.close()
    stored('session', JOB_KEY, null)
    if (S.job === job) S.job = null
    if (ev?.stage === 'running') {
      S.watch[job.profile] = { since: Date.now(), stopping: false }
      if (ev.warnings?.length) S.notice = { profile: job.profile, tone: 'warn', title: 'Playing, with a warning', text: ev.warnings.map(sentence).join(' ') }
    } else if (ev?.stage === 'cancelled' || ev?.code === 'cancelled') {
      S.notice = { profile: job.profile, ...cancelledNotice(job), at: Date.now() }
    } else if (ev && versionRefusal(ev)) {
      const p = profileNamed(job.profile)
      if (p) S.refusals[job.profile] = { mc: p.mc, message: ev.message }
    } else if (ev) {
      S.notice = { profile: job.profile, ...launchNotice(plain(ev.message)), at: Date.now() }
    }
    refresh()
  }

  // The answer is kept with the path it was for.
  async function checkJava(f) {
    const path = fieldText(f.java)
    if (!path || path === 'mojang') { f.javaCheck = null; return null }
    if (f.javaCheck?.path === path && !f.javaCheck.checking) return f.javaCheck
    f.javaCheck = { path, checking: true }
    renderSoon()
    let out
    try {
      out = await api('client/javas/check', { method: 'POST', body: { path } })
    } catch (err) {
      if (err instanceof PanelDown) {
        if (f.javaCheck?.checking) f.javaCheck = null
        throw err
      }
      out = { path, found: false, message: sentence(err.message) }
    }
    if (S.sheet === f && fieldText(f.java) === path) { f.javaCheck = out; renderSoon() }

  let pressed = false
  let renderWaits = false
  document.addEventListener('pointerdown', () => { pressed = true }, true)
  const released = () => {
    pressed = false
    if (renderWaits) { renderWaits = false; setTimeout(render, 0) }
  }

    if (pressed) renderWaits = true
    else render()

  // A typed field as the panel wants it: trimmed, and null when empty.
  function fieldText(s) { return String(s ?? '').trim() || null }

  // The sheet's fields as the panel's profile routes take them. A Fabric build only goes with Fabric.
  function profileFields(f) {
    return { mc: f.mc, loader: f.loader, loaderVersion: f.loader === 'fabric' ? fieldText(f.loaderVersion) : null, memory: f.memory, java: fieldText(f.java), harness: f.harness, server: fieldText(f.server), account: fieldText(f.account), serverList: f.serverList }
  }

  // What a New sheet POSTs: a name unless one was typed, and the fields.
  function newProfileBody(f, taken) {
    return { name: fieldText(f.name) ?? autoName(f.mc, f.loader, taken), ...profileFields(f) }
  }

  // What an Edit sheet wants the setup to be; profilePatch keeps only what changed.
  function editedProfile(f) {
    return { ...profileFields(f), assistantAccount: f.assistantAccount }
  }

  // What this page keeps by a setup's name follows it to its new one.
  function movedName(from, to) {
    if (S.pick === from) pickProfile(to)
    if (S.targets[from]) { S.targets[to] = S.targets[from]; delete S.targets[from]; saveTargets() }
    if (S.refusals[from]) { S.refusals[to] = S.refusals[from]; delete S.refusals[from] }
    // the row itself, so the sheet and the card read as the same setup until the next poll
    const row = S.summary?.profiles?.find((q) => q.name === from)
    if (row) row.name = to
    if (S.seenExits[from]) { S.seenExits[to] = S.seenExits[from]; delete S.seenExits[from] }
    if (S.crash?.profile === from) S.crash.profile = to
    if (S.log.profile === from) S.log.profile = to
    for (const e of S.exits) if (e.name === from) e.name = to
  }

  async function duplicateProfile(p) {
    const f = S.sheet
    f.saving = true
    f.error = null
    render()
    try {
      // the panel picks the name: it can see the folders a removed setup left behind
      const made = await api(`client/profiles/${enc(p.name)}/duplicate`, { method: 'POST', body: {} })
      pickProfile(made.name)
      S.flash = { tone: 'live', title: `Made ${made.name}, a copy of ${p.name}`, text: 'It has the same settings, mods and options. Worlds were not copied.' }
      S.sheet = null
    } catch (err) {
      if (err instanceof PanelDown) { S.down = true; S.downWhy = null }
      f.error = err.message
      f.saving = false
    }
    await refresh()
    if (!S.sheet) backFromSheet()
  }

  async function saveSheet() {
    const f = S.sheet
    const p0 = f.editing
    f.saving = true
    f.error = null
    render()
    try {
      // a path typed or browsed to is started once before it is saved: a typo is found here,
      // not at the next Play
      const javaWas = f.editing ? profileNamed(f.editing)?.java ?? null : null
      const typedJava = fieldText(f.java)
      if (f.javaOther && !typedJava) f.javaOther = false
      if (typedJava && typedJava !== 'mojang' && typedJava !== javaWas && !(S.javas?.javas ?? []).some((j) => j.path === typedJava)) {
        // asked again: the file may have appeared, or the last answer was the panel's trouble
        f.javaCheck = null
        const check = await checkJava(f)
        if (check && check.found === false) {
          f.adv = true
          throw new Error(`The Java was not saved: ${check.message}`)
        }
      }
      if (!f.editing) {
        const body = newProfileBody(f, profilesNow().map((q) => q.name))
        const made = await api('client/profiles', { method: 'POST', body })
        pickProfile(made?.name ?? body.name)
        S.flash = { tone: 'live', title: `Made ${setupTitle(made ?? f)}`, text: 'Press Play to start it. The first time downloads the game.' }
      } else {
        // a new name first: everything after it speaks to the setup by that name
        const wanted = fieldText(f.name)
        if (!wanted) throw new Error('A setup needs a name')
        const before = profileNamed(f.editing)
        const patch = profilePatch(before ?? {}, editedProfile(f))
        if (wanted !== f.editing) {
          const renamed = await api(`client/profiles/${enc(f.editing)}/rename`, { method: 'POST', body: { name: wanted } })
          movedName(f.editing, renamed?.name ?? wanted)
          f.editing = f.name = renamed?.name ?? wanted
        }
        let out = { warnings: [] }
        try {
          if (Object.keys(patch).length) out = await api(`client/profiles/${enc(f.editing)}`, { method: 'PATCH', body: patch })
        } catch (err) {
          // the name did change: say so, or the error reads as if nothing was saved
          if (f.editing !== p0 && !(err instanceof PanelDown)) err.message = `Renamed to ${f.editing}, but the other changes were not saved: ${err.message}`
          throw err
        }
        const label = setupTitle(out.profile ?? before ?? f)
        if (patch.mc !== undefined) delete S.refusals[f.editing]
        S.flash = out.warnings?.length
          ? { tone: 'warn', title: `Saved ${label}`, text: out.warnings.map(sentence).join(' ') }
          : Object.keys(patch).length || wanted !== (p0 ?? wanted) ? { tone: 'live', title: `Saved ${label}` } : null
      }
      S.sheet = null
    } catch (err) {
      if (err instanceof PanelDown) { S.down = true; S.downWhy = null }
      f.error = err.message
      f.saving = false
    }
    await refresh()
    if (!S.sheet) backFromSheet()
  }

  // Focus goes to "Keep it" when the strip opens, so Enter twice does not remove anything.
  function removeLabel(purge) {
    return purge ? 'Remove and delete worlds' : 'Remove setup'
  }

  async function removeProfile(p, purge) {
    try {
      await api(`client/profiles/${enc(p.name)}${purge ? '?purge=1' : ''}`, { method: 'DELETE' })
      S.flash = { tone: 'live', title: `Removed ${setupTitle(p)}`, text: purge ? 'Its folder was deleted too.' : 'Its folder was kept.' }
      if (S.pick === p.name) pickProfile(null)
      delete S.targets[p.name]
      saveTargets()
      S.sheet = null
    } catch (err) {
      S.sheet.error = err.message
      S.sheet.removing = false
    }
    await refresh()
    if (!S.sheet) backFromSheet()
  }

  // ---- accounts ------------------------------------------------------------------------------

  // The Login button (CLIENT.md, "Signing in from the launcher"): ask the panel for a sign-in,
  // listen on its stream, and only once the stream has said "pending" open Microsoft's page, so
  // the sign-in always has a listener while the person is on Microsoft's page. In a browser tab
  // the window is opened here, inside the click, while a pop-up is still allowed; it stays blank
  // until the stream answers.
  async function startLogin() {
    if (S.login) return
    S.acctNotice = null
    if (S.menu !== 'ask') S.menu = 'account'
    const tab = desktop?.openMicrosoftLogin ? null : window.open('', 'spawnloft-login')
    // cut from this page: Microsoft's page gets no handle on the launcher
    if (tab) try { tab.opener = null } catch { /* already cross-origin */ }
    let made
    try {
      made = await api('client/accounts/login', { method: 'POST' })
    } catch (err) {
      tab?.close()
      S.acctNotice = err.status === 409
        ? { tone: 'warn', title: 'A sign-in is already open in another window', text: 'Finish it there, or close that window and try again.', retry: 'Try again' }
        : { tone: 'fault', title: 'Couldn\'t start the sign-in', text: sentence(err.message), retry: 'Try again' }
      if (err instanceof PanelDown) { S.down = true; S.downWhy = null }
      return render()
    }
    if (!/^https:\/\/login\.microsoftonline\.com\//.test(String(made?.authorizeUrl ?? ''))) {
      tab?.close()
      S.acctNotice = { tone: 'fault', title: 'Couldn\'t start the sign-in', text: 'The panel answered with a sign-in address that is not Microsoft\'s.' }
      return render()
    }
    // status: what the stream said last; 'finishing' once Microsoft's part is over
    const login = { id: made.loginId, url: made.authorizeUrl, status: null, opened: false, blocked: false, done: false, tab, watcher: null }
    S.login = login
    const es = new EventSource(`/api/client/accounts/login/${enc(login.id)}/stream`)
    login.es = es
    es.onmessage = (e) => {
      let ev
      try { ev = JSON.parse(e.data) } catch { return }
      if (S.login !== login) return es.close()
      login.status = ev.status
      if (ev.status === 'pending') {
        if (!login.opened) {
          login.opened = true
          openMicrosoft(login)
        }
        return
      }
      // Microsoft's page was in the browser, which is still in front of this window
      if (login.external && !login.raised && ev.status !== 'cancelled') {
        login.raised = true
        desktop?.focusWindow?.().catch(() => {})
      }
      if (ev.status === 'finishing') return render()
      endLogin(login, ev)
    }
    es.onerror = () => {
      if (!login.done && es.readyState === EventSource.CLOSED) endLogin(login, { status: 'failed', message: 'lost the connection to the panel during the sign-in; start it again' })
    }
    render()
  }

  // A window closed while the stream still says "pending" was closed by the person: nothing is
  // coming, so the sign-in is cancelled. Once it says "finishing" the panel has Microsoft's code
  // and a DELETE would throw the account away, so closing the window then changes nothing.
  function windowClosed(login) {
    if (S.login !== login || login.status !== 'pending') return
    // not a Cancel press: the notice says the window closed, not that the person cancelled
    login.closedEarly = true
    cancelLogin(login)
  }

  async function openMicrosoft(login) {
    if (desktop?.openMicrosoftLogin) {
      let out = null
      try { out = await desktop.openMicrosoftLogin(login.url) } catch { /* refused */ }
      if (S.login !== login) return
      if (!out?.ok) {
        // an again-press that is refused leaves the waiting state as it was
        if (!login.external) login.blocked = true
        return render()
      }
      if (out.external) {
        // the system browser has the page and there is no closed signal: the stream reports the outcome
        login.external = true
        return render()
      }
      // resolves when the window has closed; a moment for a "finishing" already on its way
      setTimeout(() => windowClosed(login), 500)
      return
    }
    const w = login.tab
    if (!w || w.closed) {
      login.blocked = true
      return render()
    }
    w.location.href = login.url
    login.watcher = setInterval(() => {
      if (login.done) return clearInterval(login.watcher)
      if (w.closed) {
        clearInterval(login.watcher)
        windowClosed(login)
      }
    }, 1000)
  }

  async function cancelLogin(login) {
    if (login.done) return
    try {
      await api(`client/accounts/login/${enc(login.id)}`, { method: 'DELETE' })
    } catch { /* gone already */ }
    // the stream normally says "cancelled" first; this covers a stream that is already closed
    endLogin(login, { status: 'cancelled' })
  }

  // The outcome shows in the account menu, which opens for it.
  function endLogin(login, ev) {
    if (login.done) return
    login.done = true
    login.es?.close()
    clearInterval(login.watcher)
    if (S.login === login) S.login = null
    const thenPlay = S.afterLogin
    S.afterLogin = null
    if (ev.status === 'done' && thenPlay && ev.account?.uuid) {
      // "Who's playing?" was answered: this account plays, now
      S.menu = null
      playAs(ev.account.uuid, thenPlay)
      return
    }
    if (ev.status === 'done') {
      S.acctNotice = { tone: 'live', title: `Signed in as ${ev.account?.name ?? 'your account'}`, signedIn: ev.account?.uuid ?? null }
    } else if (ev.status === 'cancelled' && login.closedEarly) {
      S.acctNotice = { tone: 'warn', title: 'The sign-in window closed before the sign-in finished', text: 'Nothing was saved.', retry: 'Try again' }
    } else if (ev.status === 'cancelled') {
      S.acctNotice = { tone: '', title: 'Sign-in cancelled', text: 'Nothing was saved.', retry: 'Add Microsoft account' }
    } else {
      S.acctNotice = { tone: 'fault', title: sentence(plain(ev.message ?? 'the sign-in failed')), text: 'Try again, or play offline on local servers.', retry: 'Try again' }
    }
    if (S.menu !== 'ask') S.menu = 'account'
    refresh()
  }

  // Make an account the one this launcher plays as, then play `profile`.
  async function playAs(uuid, profile) {
    try {
      if (S.summary?.defaultAccount !== uuid) await api('client/accounts/default', { method: 'POST', body: { uuid } })
    } catch (err) {
      S.flash = { tone: 'fault', title: 'Couldn\'t pick who is playing', text: sentence(err.message) }
      return refresh()
    }
    await refresh()
    const p = profileNamed(profile)
    if (p) startLaunch(p)
  }

  // "Play offline as": the name is added and becomes the one this launcher plays as; from
  // "Who's playing?" (`thenPlay`, a profile name) the game starts too.
  async function addOffline(thenPlay = null) {
    const o = S.offline
    let out
    try {
      out = await api('client/accounts/offline', { method: 'POST', body: { name: o.name.trim() } })
      o.name = ''
      o.error = null
    } catch (err) {
      o.error = err.message
      if (err instanceof PanelDown) { S.down = true; S.downWhy = null }
      return refresh()
    }
    if (thenPlay) {
      S.menu = null
      return playAs(out.account.uuid, thenPlay)
    }
    try {
      if (out.defaultAccount !== out.account.uuid) await api('client/accounts/default', { method: 'POST', body: { uuid: out.account.uuid } })
      S.acctNotice = { tone: 'live', title: `Playing as ${out.account.name}`, text: 'An offline name, for local servers.' }
    } catch (err) {
      S.acctNotice = { tone: 'fault', title: `Added ${out.account.name}, but couldn't play as it`, text: sentence(err.message) }
    }
    refresh()
  }

  async function setDefault(uuid) {
    S.acctNotice = null
    try {
      await api('client/accounts/default', { method: 'POST', body: { uuid } })
      S.menu = null
      S.acctAsk = null
    } catch (err) {
      S.acctNotice = { tone: 'fault', title: 'Couldn\'t change who is playing', text: sentence(err.message) }
    }
    refresh()
  }

  async function removeAccount(a) {
    S.acctAsk = null
    try {
      await api(`client/accounts/${enc(a.uuid)}`, { method: 'DELETE' })
      S.acctNotice = { tone: '', title: a.type === 'offline' ? `Removed ${a.name}` : `Signed out ${a.name}`, text: 'A setup that was set to play as this account asks for another one before it plays.' }
    } catch (err) {
      S.acctNotice = { tone: 'fault', title: `Couldn't remove ${a.name}`, text: sentence(err.message) }
    }
    await refresh()
    // the button that was pressed is gone with the question
    if (!document.activeElement || document.activeElement === document.body) $('chip')?.focus({ preventScroll: true })
  }

  // ---- the poll ------------------------------------------------------------------------------

  // after something this page did: show it now, then read the panel again
  function refresh() {
    render()
    return poll()
  }

  let pollTimer = null
  let polling = null

  // One read of the launcher summary every few seconds (and right after anything this page
  // changes), plus the log of a game that closed early. Re-renders only on a change, so a field
  // being typed in is not rebuilt for nothing.
  // A call while a read is under way gets one more read after it: that read began before
  // whatever the caller just changed.
  let pollAgain = false
  function poll() {
    clearTimeout(pollTimer)
    if (polling) {
      pollAgain = true
      return polling
    }
    polling = (async () => {
      do {
        pollAgain = false
        await pollOnce()
      } while (pollAgain)
    })().finally(() => {
      polling = null
      clearTimeout(pollTimer)
      pollTimer = setTimeout(poll, POLL_MS)
    })
    return polling
  }

  async function pollOnce() {
    try {
      const next = await api('client/launcher')
      noticeExits(next, !S.summary)
      S.summary = next
      S.down = false
      S.downWhy = null
    } catch (err) {
      if (err instanceof PanelDown) { S.down = true; S.downWhy = null }
      // An answer that is an error is not "still loading": with nothing to show yet, the page
      // says so and why, where it used to sit on the loading shapes for as long as it lasted.
      else if (!S.summary) { S.down = true; S.downWhy = sentence(err.message) }
    }
    await readLog()
    await readLive()
    // the game went while "Stop the game?" was up: the question goes, and focus to what replaces it
    const asked = S.stopAsk && !profileNamed(S.stopAsk)?.running
    if (asked) S.stopAsk = null
    if (S.notice?.busy && Date.now() - (S.notice.at ?? 0) > 30000) S.notice = null
    // the minute, while a game runs: "for 12 minutes" moves on though nothing else changed
    const minute = profilesNow().some((p) => p.running) ? Math.floor(Date.now() / 60000) : 0
    const key = JSON.stringify([S.summary, S.down, S.downWhy, S.log, S.live, minute, S.notice, S.crash && { ...S.crash }])
    // lines being selected in a log are left alone: rebuilding the page would drop the selection,
    // and selecting is the way to copy when Copy cannot. The read after it is let go shows the rest.
    if (key !== lastKey && !selectingLog()) {
      lastKey = key
      // not between the press and the release of a click, which the rebuild would swallow
      renderSoon()
      if (asked && document.activeElement === document.body) $('play')?.focus({ preventScroll: true })
    }
  }

  function selectingLog() {
    const sel = window.getSelection?.()
    if (!sel || sel.isCollapsed || !sel.anchorNode) return false
    return ['liveLogPre', 'crashLogPre'].some((id) => $(id)?.contains(sel.anchorNode))
  }

  // A game this page saw running that is gone, not stopped from here, may have crashed: the log
  // decides (readLog), and until it has been read nothing shows. One exit is looked at at a time;
  // the rest wait their turn (S.exits), so two games gone in the same poll both get seen.
  function noticeExits(next, first = false) {
    // a game running again is no longer the crash being shown
    if (S.crash && next.profiles.some((p) => p.name === S.crash.profile && p.running)) dropCrash()
    // what the panel recorded while this page was not there to see it
    if (first) S.exits.push(...unseenCrashes(next.profiles, S.seenExits, Date.now()))
    S.exits.push(...watchedExits(S.watch, next.profiles, Date.now()))
    nextExit()
  }

  // The next exit waiting, if no crash is being shown or read.
  function nextExit() {
    if (S.crash || !S.exits.length) return
    const { name, seconds, early, exit = null, watch = null } = S.exits.shift()
    S.crash = { profile: name, seconds, early, exit, watch, report: null, pending: true }
    S.logMore = false
    S.log = { profile: name, lines: [] }
  }

  // The log is read once, for a game that has gone; it does not change after that. exitVerdict
  // says whether the game was closed (no callout) or crashed (the callout with the log's last lines).
  async function readLog() {
    const c = S.crash
    if (!c || !c.pending || profileNamed(c.profile)?.running) return
    // The process can be seen gone a moment before the panel has written how it ended (Windows
    // above all): with no record yet, the next read is waited for once before the log decides alone.
    if (!c.exit && c.watch) {
      c.exit = recordedExit(profileNamed(c.profile)?.lastExit, c.watch)
      if (!c.exit && !c.waited) { c.waited = true; return }
    }
    try {
      const out = await api(`client/profiles/${enc(c.profile)}/log?lines=${LOG_SCAN}`)
      const lines = out.lines ?? []
      if (crashVerdict(c.exit, lines, c.early) === 'closed') {
        // an exit the record calls abnormal but the log shows as a quit is not asked about again
        seenExit(c)
        if (S.crash === c) S.crash = null
        S.log = { profile: null, lines: [] }
        nextExit()
        return
      }
      c.pending = false
      // all of them are kept: the notice shows the last few, and the rest on "Show more"
      S.log = { profile: c.profile, lines }
    } catch { /* the next poll tries again */ }
  }

  // ---- start ---------------------------------------------------------------------------------

  // a click outside the open menu closes it; a click inside one rebuilds it, so its target may
  // already be out of the page
  document.addEventListener('click', (e) => {
    if (!S.menu || !e.target.isConnected) return
    if (!(e.target.closest('[data-menu]')?.dataset.menu ?? '').split(' ').includes(S.menu)) closeMenu()
  })
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return
    if (S.menu) closeMenu({ refocus: true })
    // the version list first, then the sheet it is in
    else if (S.sheet?.vOpen) { S.sheet.vOpen = false; S.sheet.vFind = ''; render(); $('fMc')?.focus({ preventScroll: true }) }
    else if (S.sheet) closeSheet()
    else if (S.stopAsk) { S.stopAsk = null; render(); $('stop')?.focus({ preventScroll: true }) }
  })
  document.addEventListener('visibilitychange', () => { if (!document.hidden) poll() })

  // The old screens' links still land somewhere: #profiles opens the setups, #accounts the
  // account menu. The address is put back to #play so the same link works twice.
  function followHash() {
    const hash = location.hash.slice(1)
    const menu = hash === 'profiles' ? 'setups' : hash === 'accounts' ? 'account' : null
    if (hash && hash !== 'play') try { history.replaceState(null, '', '#play') } catch { /* file: or a sandbox */ }
    return menu
  }
  // #accounts opens the account menu; #profiles lands on the setups, which are always in view
  function followMenu(menu) {
    if (menu !== 'setups') return openMenu(menu)
    const cur = currentProfile()
    const to = (cur && $(`setup-${cur.name}`)) ?? $('newSetup')
    to?.focus()
    to?.scrollIntoView({ block: 'nearest' })
  }
  window.addEventListener('hashchange', () => {
    const menu = followHash()
    if (menu && S.summary && !S.sheet) followMenu(menu)
  })

  // A server card's Play with no fitting setup leaves { mc, server }: a setup of that version is
  // picked and joins the server, or the New setup sheet opens filled in for it.
  function prefillPick(prefill, profiles) {
    const mc = typeof prefill?.mc === 'string' ? prefill.mc : ''
    const server = typeof prefill?.server === 'string' ? prefill.server : ''
    const fits = profiles.filter((p) => !mc || p.mc === mc)
    // the panel names the setup its Play button stands for; one that is gone falls back to a fit
    const named = typeof prefill?.profile === 'string' ? profiles.find((p) => p.name === prefill.profile) ?? null : null
    return { mc, server, profile: named ?? fits.find((q) => q.server === server) ?? fits[0] ?? null, play: prefill?.play === true && Boolean(named) }
  }

  function takePrefill(prefill) {
    if (!prefill || typeof prefill !== 'object') return
    // a sheet already open keeps what was typed into it, and says why nothing started
    if (S.sheet) {
      S.sheet.error = 'Save or cancel this setup first, then press Play on the server again'
      return render()
    }
    const { mc, server, profile: p, play } = prefillPick(prefill, profilesNow())
    if (p) {
      // a running or launching setup is shown as it is; its Join changes from the next launch
      pickProfile(p.name)
      const known = server && serversNow().some((s) => s.name === server)
      if (known) setTarget(p, { server })
      // A server card's Play is this page's Play, pressed for the person: the launch starts here,
      // with its progress and Cancel. Not when Play here would do more than they asked for (start
      // a stopped server) or cannot go ahead: then the page shows why, and the button is theirs.
      const plan = launchPlan(p)
      if (play && known && !S.job && !S.menu && !plan.blocked && !plan.startsServer && plan.picked?.name === server) startLaunch(p)
      else {
        render()
        // what was pressed (a link in the reason, a server's card) may be gone with the old setup
        if (!document.activeElement || document.activeElement === document.body) ($('play') ?? $('stop'))?.focus({ preventScroll: true })
      }
    } else {
      openSheet(null, { mc, server })
    }
  }

  {
    const menu = followHash()
    // a launch this tab started before a reload: follow it again
    try {
      const was = JSON.parse(stored('session', JOB_KEY) ?? 'null')
      if (was?.id && was.profile) {
        S.job = { id: String(was.id), profile: String(was.profile), stage: 'start', message: '', percent: null, reached: -1, startsServer: Boolean(was.startsServer), done: false }
        followJob(S.job, null)
      }
    } catch { stored('session', JOB_KEY, null) }
    render()
    poll().then(() => {
      loadedOnce = true
      if (waitingNote) takePrefill(waitingNote)
      else if (menu && !S.down) followMenu(menu)
      waitingNote = null
    })
  }

  // A server card's Play arrives as a message from the panel that holds this page in its frame,
  // and from nothing else: one press reaches one page (a note in shared storage reached every
  // launcher open in the browser, and each started the game), and nothing is left behind to be
  // acted on another day. A note that comes before the first answer from the panel waits for it,
  // and is read against what the panel says now, not three seconds ago.
  window.addEventListener('message', (e) => {
    if (window.parent === window || e.source !== window.parent || e.origin !== location.origin) return
    if (e.data?.type !== 'spawnloft-play-note' || !e.data.note || typeof e.data.note !== 'object') return
    const note = e.data.note
    if (!loadedOnce) { waitingNote = note; return }
    poll().then(() => takePrefill(note))
  })
  // the panel sends a note it made while this page was loading once it hears this
  if (window.parent !== window) try { window.parent.postMessage({ type: 'spawnloft-play-ready' }, location.origin) } catch { /* not the panel */ }
</script>
