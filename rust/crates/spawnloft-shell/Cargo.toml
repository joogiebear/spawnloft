[package]
name = "spawnloft-shell"
description = "SpawnLoft's window: a Tauri 2 shell over the panel that spawnloft-core serves (Phase 0 spike)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
# the Windows image name stays SpawnLoft.exe, as in 1.x: shortcuts, the taskbar pin and the
# installers' running-app check all name it (tauri.conf.json mainBinaryName says the same)
name = "SpawnLoft"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
spawnloft-lib.workspace = true
tauri = { version = "=2.12.5", features = [] }
# generate_context! expands to code naming serde_json at the crate root
serde_json = "1.0.154"
tauri-plugin-updater = "=2.14.1"
tauri-plugin-single-instance = "=2.5.5"
# native pickers and message boxes, used from Rust only: the page gets none of their commands
tauri-plugin-dialog = "=2.8.4"
# the system browser, the file manager and "show in folder", Rust only like the dialog plugin
tauri-plugin-opener = "=2.7.3"

[target.'cfg(windows)'.dependencies]
# the message box for a window that cannot open at all (no WebView2): there is no event loop yet
windows-sys = { version = "0.61.2", features = ["Win32_UI_WindowsAndMessaging"] }

[lints]
workspace = true
