<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>SpawnLoft</title>
<style>
  html, body { height: 100%; margin: 0; background: #16181d; color: #c9ccd3; font: 15px/1.5 system-ui, sans-serif; }
  body { display: grid; place-items: center; }
  main { max-width: 520px; padding: 24px; text-align: center; }
  .dim { opacity: .7; }
  /* A start that is slow says so, so the window does not look stuck. */
  #slow { opacity: 0; animation: late .4s 12s forwards; }
  @keyframes late { to { opacity: .7; } }
  h1 { font-size: 20px; margin: 0 0 8px; color: #e9ecf4; }
  p { margin: 0 0 8px; }
  nav { display: flex; gap: 8px; justify-content: center; margin: 20px 0; flex-wrap: wrap; }
  a.btn { padding: 7px 14px; border: 1px solid #354056; border-radius: 6px; color: #e9ecf4; text-decoration: none; background: #1c2130; }
  a.btn.primary { background: #4a67e8; border-color: #4a67e8; color: #fff; }
  a.btn:focus-visible { outline: 2px solid #9cb0ff; outline-offset: 2px; }
  details { text-align: left; color: #9aa4ba; font-size: 13px; }
  summary { cursor: pointer; text-align: center; }
  code { display: block; margin-top: 8px; white-space: pre-wrap; word-break: break-word; font: 12px ui-monospace, monospace; }
</style>
<!-- Shown for the moment between the window opening and the panel answering, and when it never does. -->
<main id="starting">
  <p class="dim">Starting SpawnLoft…</p>
  <p id="slow">Still starting. The first start after an update takes longer.</p>
</main>
<main id="failed" hidden>
  <h1>SpawnLoft could not start</h1>
  <p id="said"></p>
  <p class="dim">Running servers are not affected.</p>
  <nav>
    <a class="btn primary" id="retry" href="index.html?do=retry">Try again</a>
    <a class="btn" href="index.html?do=log">Open the log folder</a>
    <a class="btn" href="index.html?do=quit">Quit</a>
  </nav>
  <details>
    <summary>Details</summary>
    <code id="detail"></code>
  </details>
</main>
<script>
  // The window puts what went wrong in this page's address (bridge.rs show_failure). Text only:
  // nothing here is markup, and this page calls nothing.
  (() => {
    const q = new URLSearchParams(location.search)
    if (!q.get('failed')) return
    document.getElementById('said').textContent = q.get('failed')
    document.getElementById('detail').textContent = [q.get('detail'), q.get('log') && 'Log: ' + q.get('log')].filter(Boolean).join('\n')
    document.getElementById('starting').hidden = true
    document.getElementById('failed').hidden = false
    document.getElementById('retry').focus()
  })()
</script>
</html>
