[package]
name = "spawnloft-fakes"
description = "Test helpers for SpawnLoft's Rust crates: temp dirs, running binaries, and later fake java, mariadb, CDNs and token endpoints"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# lock-probe takes the real lock; spawnloft-lib has no dependency on this crate, so no cycle
spawnloft-lib.workspace = true
# registry-probe passes JSON through; already in the tree through spawnloft-lib
serde_json = "1.0.154"

# Test-only: takes and probes util.mjs's lock from a Rust process, for
# test/lock-cross-process.test.mjs.
[[bin]]
name = "lock-probe"
path = "src/bin/lock-probe.rs"

# Test-only: changes instances.json through spawnloft-lib's registry writes, for
# test/registry-cross-process.test.mjs.
[[bin]]
name = "registry-probe"
path = "src/bin/registry-probe.rs"

# Test-only: reads and writes zips through spawnloft-lib's zip module, for
# test/zip-cross-process.test.mjs.
[[bin]]
name = "zip-probe"
path = "src/bin/zip-probe.rs"

# Test-only: the C1 network checks (name resolution and TLS in the static musl build, proxy
# variables ignored), in the musl-network job of rust-internal.yml.
[[bin]]
name = "net-probe"
path = "src/bin/net-probe.rs"

# Test-only: plays schtasks, powershell, launchctl, systemctl and loginctl for the parity rig's
# scheduled-task scenarios (SPAWNLOFT_TEST_SCHEDULER, C6).
[[bin]]
name = "fake-scheduler"
path = "src/bin/fake-scheduler.rs"

# Test-only: the native JVM stand-in for the installer scenarios (installer.yml,
# installer-linux.yml), which 1.x's and 2.0's daemons both run; ported from the
# installer/ci/fake-java.mjs it replaces.
[[bin]]
name = "fake-java"
path = "src/bin/fake-java.rs"
