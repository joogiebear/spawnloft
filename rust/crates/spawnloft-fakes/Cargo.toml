[package]
name = "spawnloft-fakes"
description = "Test helpers for SpawnLoft's Rust crates: temp dirs, running binaries, and later fake java, mariadb, CDNs and token endpoints"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# the probes run the real modules; spawnloft-lib has no dependency on this crate, so no cycle
spawnloft-lib.workspace = true
# already in the tree through spawnloft-lib
serde_json = "1.0.154"

# Test-only: reads and writes zips through spawnloft-lib's zip module, for the zip-fuzz job of
# rust-internal.yml.
[[bin]]
name = "zip-probe"
path = "src/bin/zip-probe.rs"

# Test-only: the C1 network checks (name resolution and TLS in the static musl build, proxy
# variables ignored), in the musl-network job of rust-internal.yml.
[[bin]]
name = "net-probe"
path = "src/bin/net-probe.rs"

# Test-only: plays schtasks, powershell, launchctl, systemctl and loginctl for the parity rig's
# scheduled-task scenarios (SPAWNLOFT_TEST_SCHEDULER, C6).
[[bin]]
name = "fake-scheduler"
path = "src/bin/fake-scheduler.rs"

# Test-only: the native JVM stand-in for the installer scenarios (installer.yml,
# installer-linux.yml), which 1.x's and 2.0's daemons both run; ported from the
# installer/ci/fake-java.mjs it replaces.
[[bin]]
name = "fake-java"
path = "src/bin/fake-java.rs"

# Test-only: the MariaDB tools for the installer scenarios (installer.yml), one program copied
# under each tool's name; a native port of test/fixtures/fake-mariadb, which a release 2.0 core
# cannot run.
[[bin]]
name = "fake-mariadb"
path = "src/bin/fake-mariadb.rs"
