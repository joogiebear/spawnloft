[package]
name = "spawnloft-core"
description = "SpawnLoft's console binary: CLI, per-server daemon, MCP server, task runner, panel API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "spawnloft-core"
path = "src/main.rs"

[features]
# test and CI builds only (spawnloft-lib's test-hooks); never in a release package
test-hooks = ["spawnloft-lib/test-hooks"]

[dependencies]
spawnloft-lib.workspace = true
regex = "1.13.1"
semver = "1.0.28"
serde_json = "1.0.154"

[dev-dependencies]
spawnloft-fakes.workspace = true

[lints]
workspace = true
