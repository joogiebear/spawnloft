# cargo deny: the supply-chain policy agreed on 2026-11-05 (rust-plan PLAN.md section 8).
# crates.io only, no git dependencies, a licence allowlist, and RustSec advisories fail the build.
# Every direct crate added later also gets a line in SUPPLY-CHAIN.md saying why it is trusted.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Unmaintained (not vulnerable) crates that only the Tauri shell pulls in, all on Linux: GTK's
# macros and the D-Bus crates behind tauri-plugin-single-instance. No maintained release of
# Tauri 2 avoids them. Each entry is re-checked by the thread that bumps Tauri (P0-F, 2026-11-08).
ignore = [
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error via glib-macros (gtk-rs 0.18), Linux build of tauri only; compile-time macro" },
  { id = "RUSTSEC-2026-0370", reason = "zvariant via zbus 5 (tauri-plugin-single-instance on Linux); merged into zbus 6, which the plugin has not adopted yet" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names via zbus 5, as above" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive via zbus 5, as above" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# the allowlist is the policy for crates to come, so an entry nothing uses yet is not a warning
unused-allowed-license = "allow"
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
  # webpki-root-certs (Mozilla's root list as data), via reqwest in tauri and its updater plugin
  "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# workspace path dependencies carry no version, which is fine for crates that never publish
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
