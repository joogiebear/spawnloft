# The other half of verify-build.mjs's complaint that "there is no CI on this repository".
# This runs what can run without secrets: the test suite and a CLI smoke check. Building,
# signing and publishing stay on the release machine - the signing profile lives there.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Windows has its own scheduler (schtasks), control channel (a named pipe), paths (drive
    # letters) and process table, none of which the Linux job below exercises.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        run: npm test
      - name: Smoke-check the CLI
        run: |
          node mcctl.mjs help
          node mcctl.mjs list

  # Linux is a platform SpawnLoft ships for, with code of its own that only runs here: the
  # systemd scheduler's unit files, /proc sampling against a live process, the zip reader and
  # writer checked against Python's, process-group kills, and unix socket path limits. Both
  # jobs count; neither stands in for the other. The job keeps its name because branch
  # protection on main requires a check called test-linux.
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        run: npm test
      - name: Smoke-check the CLI
        run: |
          node mcctl.mjs help
          node mcctl.mjs list
          # The checkout's shell entry point: present, executable, and with LF line endings.
          ./spawnloft config
