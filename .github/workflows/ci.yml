# The other half of verify-build.mjs's complaint that "there is no CI on this repository".
# This runs what can run without secrets: the test suite and a CLI smoke check. Building,
# signing and publishing stay on the release machine - the signing profile lives there.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # dev is next month's release and main is this month's, and the version says which is which.
  # A prerelease version on dev is what switches the beta pipeline ON: after a stable release dev
  # sits at a stable version, the previews skip themselves, and nothing says so - that is how dev
  # was still calling itself 0.15.0-beta.1 after 1.0.0 had shipped. So the first pull request of a
  # month cannot go in without the bump, and a release cannot go to main with a beta number on it.
  version-policy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The version fits the branch this is headed for
        env:
          BASE: ${{ github.base_ref }}
        run: |
          version=$(node -p "require('./desktop/package.json').version")
          core=$(node -p "require('./package.json').version")
          if [ "$version" != "$core" ]; then
            echo "::error::package.json says $core and desktop/package.json says $version. Set both: node desktop/set-version.mjs <version>"
            exit 1
          fi
          case "$BASE:$version" in
            dev:*-beta.*) echo "dev <- $version: a prerelease, so merging this publishes a beta." ;;
            dev:*)
              echo "::error::dev has to carry a prerelease version, or the beta pipeline stays switched off. Start the month: node desktop/set-version.mjs <next minor>.0-beta.1"
              exit 1 ;;
            main:*-*)
              echo "::error::main only takes stable versions. On the release branch: node desktop/set-version.mjs X.Y.Z"
              exit 1 ;;
            *) echo "$BASE <- $version" ;;
          esac

  test:
    # Windows has its own scheduler (schtasks), control channel (a named pipe), paths (drive
    # letters) and process table, none of which the Linux job below exercises.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        run: npm test
      - name: Smoke-check the CLI
        run: |
          node mcctl.mjs help
          node mcctl.mjs list

  # Linux is a platform SpawnLoft ships for, with code of its own that only runs here: the
  # systemd scheduler's unit files, /proc sampling against a live process, the zip reader and
  # writer checked against Python's, process-group kills, and unix socket path limits. Both
  # jobs count; neither stands in for the other. The job keeps its name because branch
  # protection on main requires a check called test-linux.
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        run: npm test
      - name: Smoke-check the CLI
        run: |
          node mcctl.mjs help
          node mcctl.mjs list
          # The checkout's shell entry point: present, executable, and with LF line endings.
          ./spawnloft config
      # The packages run the core on Node 24, and Node 24 is not Node 22: it names its main thread,
      # which is what `ps` reports as the process name, and that alone made every server ORPHANED.
      # Nothing in this job noticed, because this job only ran 22.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test on the runtime the packages carry
        run: npm test
