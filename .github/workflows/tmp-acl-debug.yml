name: tmp-acl-debug
on:
  pull_request:
    paths: ['.github/workflows/tmp-acl-debug.yml']
jobs:
  acl:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: probe (files written by Node, as the rig does; round 2)
        shell: pwsh
        run: |
          $d = node -e "const fs=require('fs'),os=require('os'),p=require('path');const d=fs.realpathSync.native(fs.mkdtempSync(p.join(os.tmpdir(),'sl-acl-')));fs.mkdirSync(p.join(d,'run','data','client'),{recursive:true});fs.writeFileSync(p.join(d,'run','data','instances.json'),JSON.stringify({version:1,instances:{}}));fs.writeFileSync(p.join(d,'run','data','client','accounts.json'),'{}');console.log(d)"
          $f = "$d\run\data\instances.json"
          "== folder"; icacls "$d"; icacls "$d\run\data"
          "== file"; icacls "$f"
          "== Get-Acl"; (Get-Acl $f).Access | Format-Table IdentityReference,IsInherited,FileSystemRights -AutoSize
          "== sddl"; (Get-Acl $f).Sddl
          "== node inspect"
          node --input-type=module -e "const m=await import('./src/private-files.mjs');const f=process.argv[1];console.log(JSON.stringify(m.inspectPrivateFile(f)))" "$f"
          "== node doctor --json"
          $env:SPAWNLOFT_DATA_ROOT="$d\run\data"; $env:NODE_ENV="test"
          node spawnloft.mjs doctor --json
          exit 0
