name: installer-mac

# The 2.0 macOS packaging (rust/INSTALLER-UPDATER-DESIGN.md section 6; design section 14 thread
# T3), internal only, v2 only; successor of tauri-spike-mac.yml. Builds 2.x a and b signed with
# the release Developer ID and notarized, packages each into the two update artifacts from the one
# notarized bundle (the Squirrel.Mac zip + 1.x feeds, and Tauri's .app.tar.gz + .sig), asserts the
# build with verify-mac-build, then runs the cross-generation Squirrel.Mac smoke (a published 1.x
# install updates to the 2.0 Tauri app). The 2.x -> 2.y plugin cycle and the acceptance on Victor's
# Mac mini are the hands-on steps (design section 6: the Mac plugin path is "verify on the mini");
# the a and b artifacts this workflow uploads are what the mini takes. Nothing leaves the runners
# except workflow artifacts kept 14 days: no feed, no tag, no release. Victor approved signing in
# CI on 2026-11-09 (MAC_CSC_LINK / APPLE_* secrets).
#
# The a and b artifacts here are internal test builds for the 2.x -> 2.y plugin cycle (design
# section 11 scenario 5, as updater.yml runs it on Windows): the core is built with the
# `internal-feed` feature (it reads SPAWNLOFT_UPDATE_SOURCE, a loopback base) and both the core and
# the shell trust only this run's throwaway key (SPAWNLOFT_UPDATE_PUBKEYS); the shell is built with
# --feed-http. They are beta-numbered because an internal version has no update channel. The job
# also writes the signed loopback feed (make-mac-feed.mjs, fixed port FEED_PORT) and runs the cycle
# on the runner (mac-plugin-cycle.cjs); the Mac mini runs the same script on the same artifact. The
# real release artifacts are the HTTPS ones the release pipeline builds with the release keys
# (desktop/release-feed.mjs, .github/workflows/release.yml), never these. Everything else
# (signing, notarization, the Squirrel.Mac zip) is identical.
# Each run does two Developer ID notarizations on an expensive macOS runner, so the trigger is
# kept narrow (the Rust core/shell and the Mac signing helper); push other changes through
# workflow_dispatch.
#
# The RELEASE build (rust/beta-review/REVIEW.md B3): dispatched with `release_version` set, the
# test jobs are skipped and the `release` job builds the macOS half of a release at that version
# instead: the core without the internal-feed feature and with no key override (it trusts the
# release keys of update/keys.rs), the shell from release.pub without --feed-http, an app AND a
# .dmg, the app notarized and stapled by `tauri build`, the .dmg signed, notarized and stapled
# here. The updater tarball's own .sig is made with a throwaway key: the release assembly
# (desktop/release-assemble.mjs) re-signs it on its release name with the release key, so the
# real key never reaches a macOS runner. The job proves the build (verify-mac-build, what the core
# and shell trust, `update status` of the built core) and runs the release gate on the mac half
# (--release --partial --throwaway-key). The artifact `installer-mac-release-<version>` holds the
# three release-named files the assembly takes. Nothing is tagged or published.

on:
  push:
    branches: [v2]
    paths:
      - 'rust/**'
      - 'desktop/mac-signing.cjs'
      - '.github/workflows/installer-mac.yml'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Build the RELEASE macOS app at this version (2.0.0-beta.N or 2.0.0) instead of the test builds. Nothing is published.'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: installer-mac-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  VERSION_A: 2.0.0-beta.901
  VERSION_B: 2.0.0-beta.902
  # the loopback port the test feed's URLs name (make-mac-feed.mjs, mac-plugin-cycle.cjs)
  FEED_PORT: '47613'

jobs:
  build:
    if: (github.ref == 'refs/heads/v2' || github.event_name == 'workflow_dispatch') && !inputs.release_version
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Install the pinned toolchain
        working-directory: rust
        run: rustup toolchain install
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-installer-mac-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}-${{ github.run_id }}
          restore-keys: |
            rust-installer-mac-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}-
            rust-spike-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}-
      - name: Install the Tauri CLI (pinned, from npm)
        run: npm install --prefix "$RUNNER_TEMP/tauri-cli" --no-save --no-package-lock @tauri-apps/cli@2.12.4
      - name: A throwaway updater key for this run, the only key a and b trust
        run: |
          "$RUNNER_TEMP/tauri-cli/node_modules/.bin/tauri" signer generate --ci -p "" -w "$RUNNER_TEMP/ci.key" -f
          # the CLI writes the .pub as one base64 line holding the two-line minisign file (decoded
          # with Node: macOS base64 -d refuses it and the fallback would pass the base64 through)
          keys="$(node -e '
            const t = Buffer.from(require("fs").readFileSync(process.argv[1], "utf8").trim(), "base64").toString("utf8").trim().split("\n")
            const id = t[0].trim().split(" ").pop(), line = t[1].trim()
            if (!/^[0-9A-F]{16}$/i.test(id) || !/^RW[A-Za-z0-9+/=]{54}$/.test(line)) throw new Error("unexpected .pub: " + t.join(" | "))
            console.log(`${id}=${line}`)' "$RUNNER_TEMP/ci.key.pub")"
          echo "SPAWNLOFT_UPDATE_PUBKEYS=$keys" >> "$GITHUB_ENV"
      - name: Generate the macOS icon
        run: |
          "$RUNNER_TEMP/tauri-cli/node_modules/.bin/tauri" icon desktop/build/icon-mac.png -o "$RUNNER_TEMP/icons"
      - name: Import the Developer ID identity into a temporary keychain
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        run: |
          kc="$RUNNER_TEMP/installer-mac-signing.keychain-db"
          kcpw="$(uuidgen)"
          echo "$MAC_CSC_LINK" | base64 --decode > "$RUNNER_TEMP/devid.p12"
          security create-keychain -p "$kcpw" "$kc"
          # covers a cold-cache compile of the shell before the first codesign, within the 90-min job
          security set-keychain-settings -lut 7200 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          security import "$RUNNER_TEMP/devid.p12" -k "$kc" -P "$MAC_CSC_KEY_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kcpw" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/devid.p12"
          identity="$(security find-identity -v -p codesigning "$kc" | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -1)"
          test -n "$identity"
          echo "SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "KEYCHAIN=$kc" >> "$GITHUB_ENV"
      - name: Build, sign, notarize, verify and package 2.x a and b
        working-directory: rust/crates/spawnloft-shell
        env:
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          export TAURI_SIGNING_PRIVATE_KEY="$(cat "$RUNNER_TEMP/ci.key")"
          export APPLE_SIGNING_IDENTITY="$SIGNING_IDENTITY"
          tauri="$RUNNER_TEMP/tauri-cli/node_modules/.bin/tauri"
          app=../../target/release/bundle/macos/SpawnLoft.app
          mkdir -p "$RUNNER_TEMP/feed"
          for v in "$VERSION_A" "$VERSION_B"; do
            # the core carries the installed version, so it is built once per version (as a release
            # is), with the loopback feed override, then signed separately: Tauri does not sign
            # resource binaries
            (cd ../.. && SPAWNLOFT_VERSION="$v" cargo build --release --locked -p spawnloft-core --features spawnloft-lib/internal-feed)
            codesign --force --options runtime --timestamp --sign "$SIGNING_IDENTITY" --keychain "$KEYCHAIN" ../../target/release/spawnloft-core
            codesign --verify --strict --verbose=2 ../../target/release/spawnloft-core
            ../../target/release/spawnloft-core --version
            # the bundled Node (PLAN-2.0-REMAINING.md A7): pinned and hash-checked, then signed with
            # the Developer ID and the JIT entitlements, which V8 needs under the hardened runtime
            node installer/mac-config.mjs --stage-runtime "$RUNNER_TEMP/cfg-$v"
            nodebin="$(node -p 'const d=process.argv[1]; d + "/" + require(d + "/runtime.json").exe' "$RUNNER_TEMP/cfg-$v/runtime")"
            codesign --force --options runtime --timestamp --entitlements installer/node.entitlements --sign "$SIGNING_IDENTITY" --keychain "$KEYCHAIN" "$nodebin"
            codesign --verify --strict --verbose=2 "$nodebin"
            "$nodebin" -e 'console.log("bundled node", process.version, process.arch)'
            node installer/mac-config.mjs "$v" "$RUNNER_TEMP/ci.key.pub" "$RUNNER_TEMP/cfg-$v" --icons="$RUNNER_TEMP/icons" --feed-http
            # start from a clean bundle dir so a stale .app/.app.tar.gz (from the restored cache, or
            # from build a) is never mistaken for this build
            rm -rf ../../target/release/bundle/macos
            # notarizing (and stapling) runs when APPLE_ID/PASSWORD/TEAM_ID are set; the stapler
            # fetch drops now and then, so a failed run is tried again
            for attempt in 1 2 3; do
              SPAWNLOFT_VERSION="$v" "$tauri" build --ci --bundles app --config "$RUNNER_TEMP/cfg-$v/overlay.json" && break
              echo "::warning::build, signing or notarization of $v failed on attempt $attempt of 3"
              [ "$attempt" -lt 3 ] && sleep 30 || exit 1
            done
            node installer/verify-mac-build.cjs "$app" "$v"
            node installer/mac-package.mjs "$app" "$v" "$RUNNER_TEMP/feed/$v"
          done
          ls -la "$RUNNER_TEMP/feed"/*/
      - name: The signed loopback feed for the plugin cycle
        run: |
          node rust/crates/spawnloft-shell/installer/ci/make-mac-feed.mjs \
            --out "$RUNNER_TEMP/feed/loopback" --base "http://127.0.0.1:$FEED_PORT/" \
            --tauri "$RUNNER_TEMP/tauri-cli/node_modules/.bin/tauri" \
            --key "$RUNNER_TEMP/ci.key" --pubkey "$RUNNER_TEMP/ci.key.pub" \
            --release "$VERSION_A=$RUNNER_TEMP/feed/$VERSION_A" --release "$VERSION_B=$RUNNER_TEMP/feed/$VERSION_B"
          find "$RUNNER_TEMP/feed/loopback" -type f | sort
          cat "$RUNNER_TEMP/feed/loopback/good/download/v$VERSION_B/spawnloft-updates.json"
      - name: Remove the temporary keychain
        if: always()
        run: '[ -n "${KEYCHAIN:-}" ] && security delete-keychain "$KEYCHAIN" || true'
      - uses: actions/upload-artifact@v4
        with:
          name: installer-mac-${{ github.run_number }}-feed
          retention-days: 14
          path: ${{ runner.temp }}/feed/

  squirrel-smoke:
    needs: build
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@v4
        with:
          name: installer-mac-${{ github.run_number }}-feed
          path: ${{ runner.temp }}/feed
      - name: Install Playwright for driving the installed 1.x app
        run: npm install --prefix "$RUNNER_TEMP/mac-smoke" --no-save --no-package-lock playwright@1.63.0
      - name: Cross-generation handover (1.x -> 2.0 a) through Squirrel.Mac
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NODE_PATH: ${{ runner.temp }}/mac-smoke/node_modules
        run: |
          zip="$RUNNER_TEMP/feed/$VERSION_A/SpawnLoft-$VERSION_A-mac-arm64.zip"
          node rust/crates/spawnloft-shell/installer/ci/smoke-mac-handover.cjs "$zip" "$VERSION_A"

  plugin-cycle:
    needs: build
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@v4
        with:
          name: installer-mac-${{ github.run_number }}-feed
          path: ${{ runner.temp }}/feed
      - name: 2.x a -> b through the signed envelope and tauri-plugin-updater
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          node rust/crates/spawnloft-shell/installer/ci/mac-plugin-cycle.cjs \
            --zip-a "$RUNNER_TEMP/feed/$VERSION_A/SpawnLoft-$VERSION_A-mac-arm64.zip" --a "$VERSION_A" --b "$VERSION_B" \
            --feed "$RUNNER_TEMP/feed/loopback" --port "$FEED_PORT" --apps "$RUNNER_TEMP/Applications" --out plugin-cycle-results
      - name: Print the results
        if: always()
        run: |
          for f in plugin-cycle-results/*.json plugin-cycle-results/*.log plugin-cycle-results/config/spawnloft/update.log; do
            [ -f "$f" ] && { echo "===== $f"; cat "$f"; }
          done
          true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installer-mac-${{ github.run_number }}-plugin-cycle
          retention-days: 14
          path: plugin-cycle-results/

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.release_version
    runs-on: macos-15
    timeout-minutes: 90
    env:
      RELEASE_VERSION: ${{ inputs.release_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: The version is a release version (beta or stable, never internal)
        run: |
          node -e '
            import("./desktop/update-envelope.mjs").then(({ channelOf }) => {
              const v = process.env.RELEASE_VERSION
              if (!/^2\.\d+\.\d+(-beta\.\d+)?$/.test(v)) throw new Error(`${v} is not 2.x.y or 2.x.y-beta.N`)
              console.log(`${v}: ${channelOf(v)} channel`)
            })'
          # nothing that shapes a test build may reach this job
          for v in SPAWNLOFT_UPDATE_PUBKEYS SPAWNLOFT_UPDATE_SOURCE SPAWNLOFT_FEED_BASELINE; do
            [ -z "${!v:-}" ] || { echo "::error::$v is set; a release build trusts only the compiled-in release keys"; exit 1; }
          done
      - name: Install the pinned toolchain
        working-directory: rust
        run: rustup toolchain install
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-release-mac-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}-${{ github.run_id }}
          restore-keys: |
            rust-release-mac-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}-
      - name: Install the Tauri CLI (pinned, from npm)
        run: |
          npm install --prefix "$RUNNER_TEMP/tauri-cli" --no-save --no-package-lock @tauri-apps/cli@2.12.4
          echo "TAURI_CLI=$RUNNER_TEMP/tauri-cli/node_modules/.bin/tauri" >> "$GITHUB_ENV"
      - name: A throwaway key for the bundler's own tarball .sig (the assembly re-signs it)
        run: |
          "$TAURI_CLI" signer generate --ci -p "" -w "$RUNNER_TEMP/bundler.key" -f
          node -e 'process.stdout.write(Buffer.from(require("fs").readFileSync(process.argv[1], "utf8").trim(), "base64"))' "$RUNNER_TEMP/bundler.key.pub" > "$RUNNER_TEMP/bundler.pub"
      - name: Generate the macOS icon
        run: '"$TAURI_CLI" icon desktop/build/icon-mac.png -o "$RUNNER_TEMP/icons"'
      - name: Import the Developer ID identity into a temporary keychain
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        run: |
          for v in MAC_CSC_LINK MAC_CSC_KEY_PASSWORD; do [ -n "${!v}" ] || { echo "::error::the $v secret is not available to this workflow"; exit 1; }; done
          kc="$RUNNER_TEMP/release-mac-signing.keychain-db"
          kcpw="$(uuidgen)"
          echo "$MAC_CSC_LINK" | base64 --decode > "$RUNNER_TEMP/devid.p12"
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 7200 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          security import "$RUNNER_TEMP/devid.p12" -k "$kc" -P "$MAC_CSC_KEY_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kcpw" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/devid.p12"
          identity="$(security find-identity -v -p codesigning "$kc" | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -1)"
          test -n "$identity"
          echo "SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "KEYCHAIN=$kc" >> "$GITHUB_ENV"
      - name: Build, sign, notarize and verify the release app and dmg
        working-directory: rust/crates/spawnloft-shell
        env:
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for v in APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do [ -n "${!v}" ] || { echo "::error::$v is empty: the release app must be notarized"; exit 1; }; done
          export TAURI_SIGNING_PRIVATE_KEY="$(cat "$RUNNER_TEMP/bundler.key")"
          export APPLE_SIGNING_IDENTITY="$SIGNING_IDENTITY"
          v="$RELEASE_VERSION"
          cfg="$RUNNER_TEMP/cfg"
          # the release core: no internal-feed feature, no key override
          (cd ../.. && SPAWNLOFT_VERSION="$v" cargo build --release --locked -p spawnloft-core)
          codesign --force --options runtime --timestamp --sign "$SIGNING_IDENTITY" --keychain "$KEYCHAIN" ../../target/release/spawnloft-core
          codesign --verify --strict --verbose=2 ../../target/release/spawnloft-core
          ../../target/release/spawnloft-core --version
          node installer/mac-config.mjs --stage-runtime "$cfg"
          # the pinned archive's bytes, before the Developer ID signature changes them
          node -e "import('../../../desktop/payload-gate.mjs').then(m => { const p = m.checkRuntime(process.argv[1]); if (p.length) { console.error(p.join('\\n')); process.exit(1) } console.log('bundled Node is the pinned archive') })" "$cfg/runtime"
          nodebin="$(node -p 'const d=process.argv[1]; d + "/" + require(d + "/runtime.json").exe' "$cfg/runtime")"
          codesign --force --options runtime --timestamp --entitlements installer/node.entitlements --sign "$SIGNING_IDENTITY" --keychain "$KEYCHAIN" "$nodebin"
          codesign --verify --strict --verbose=2 "$nodebin"
          # release.pub, no --feed-http: the shell trusts the release key and speaks HTTPS only
          node installer/mac-config.mjs "$v" release.pub "$cfg" --icons="$RUNNER_TEMP/icons"
          if grep -q dangerousInsecureTransportProtocol "$cfg/overlay.json"; then echo "::error::the release overlay allows an HTTP feed"; exit 1; fi
          rm -rf ../../target/release/bundle/macos ../../target/release/bundle/dmg
          for attempt in 1 2 3; do
            SPAWNLOFT_VERSION="$v" "$TAURI_CLI" build --ci --bundles app,dmg --config "$cfg/overlay.json" && break
            echo "::warning::build, signing or notarization of $v failed on attempt $attempt of 3"
            [ "$attempt" -lt 3 ] && sleep 30 || exit 1
          done
          app=../../target/release/bundle/macos/SpawnLoft.app
          node installer/verify-mac-build.cjs "$app" "$v"
          # the Squirrel.Mac zip and the updater tarball, from the one notarized bundle
          node installer/mac-package.mjs "$app" "$v" "$RUNNER_TEMP/pkg"
          dmg="$(ls ../../target/release/bundle/dmg/*.dmg | head -1)"
          test -f "$dmg" || { echo "::error::no .dmg was produced"; exit 1; }
          out="$RUNNER_TEMP/mac-release"
          mkdir -p "$out"
          cp "$dmg" "$out/SpawnLoft-$v-mac-arm64.dmg"
          cp "$RUNNER_TEMP/pkg/SpawnLoft-$v-mac-arm64.zip" "$RUNNER_TEMP/pkg/SpawnLoft-$v-mac-arm64.app.tar.gz" "$out/"
          echo "APP=$GITHUB_WORKSPACE/rust/target/release/bundle/macos/SpawnLoft.app" >> "$GITHUB_ENV"
          echo "MAC_OUT=$out" >> "$GITHUB_ENV"
      - name: Sign, notarize and staple the dmg
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          dmg="$MAC_OUT/SpawnLoft-$RELEASE_VERSION-mac-arm64.dmg"
          codesign --force --timestamp --sign "$SIGNING_IDENTITY" --keychain "$KEYCHAIN" "$dmg"
          codesign --verify --strict --verbose=2 "$dmg"
          xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait --timeout 30m | tee "$RUNNER_TEMP/notary.txt"
          grep -q 'status: Accepted' "$RUNNER_TEMP/notary.txt" || { echo "::error::the dmg was not accepted by the notary service"; exit 1; }
          # the stapler's fetch drops now and then (known flake, exit 68)
          for attempt in 1 2 3 4 5; do xcrun stapler staple "$dmg" && break; [ "$attempt" -lt 5 ] && sleep 30 || exit 1; done
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
          # the app inside the dmg is the notarized, stapled one
          mnt="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg" > /dev/null
          codesign --verify --deep --strict "$mnt/SpawnLoft.app"
          xcrun stapler validate "$mnt/SpawnLoft.app"
          short="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$mnt/SpawnLoft.app/Contents/Info.plist")"
          node desktop/build-trust.mjs "$mnt/SpawnLoft.app/Contents/MacOS/SpawnLoft" "$mnt/SpawnLoft.app/Contents/Resources/resources/bin/spawnloft-core"
          hdiutil detach "$mnt" > /dev/null
          [ "$short" = "$RELEASE_VERSION" ] || { echo "::error::the dmg holds $short, not $RELEASE_VERSION"; exit 1; }
      - name: Remove the temporary keychain
        if: always()
        run: '[ -n "${KEYCHAIN:-}" ] && security delete-keychain "$KEYCHAIN" || true'
      - name: What the built core and shell trust (release keys only, release feed code)
        run: |
          node desktop/build-trust.mjs "$APP/Contents/MacOS/SpawnLoft" "$APP/Contents/Resources/resources/bin/spawnloft-core"
          # the 1.x Squirrel.Mac zip: the same notarized, stapled app
          z="$(mktemp -d)"
          ditto -x -k "$MAC_OUT/SpawnLoft-$RELEASE_VERSION-mac-arm64.zip" "$z"
          codesign --verify --deep --strict "$z/SpawnLoft.app"
          xcrun stapler validate "$z/SpawnLoft.app"
          spctl --assess --type execute --verbose=2 "$z/SpawnLoft.app"
          node desktop/build-trust.mjs "$z/SpawnLoft.app/Contents/MacOS/SpawnLoft" "$z/SpawnLoft.app/Contents/Resources/resources/bin/spawnloft-core"
      - name: The mac record (what only a Mac can check, bound to each file's sha256)
        run: |
          # every step above passed for these exact bytes: notarized and stapled (dmg, zip, and the
          # tarball made from the same app), and the app inside the dmg and the zip trusts the
          # release keys. The assembly and the publish step take this as --evidence.
          node -e '
            const fs = require("fs"), path = require("path"), crypto = require("crypto"), os = require("os")
            const [dir, v] = process.argv.slice(1)
            const sum = n => crypto.createHash("sha256").update(fs.readFileSync(path.join(dir, n))).digest("hex")
            const dmg = `SpawnLoft-${v}-mac-arm64.dmg`, zip = `SpawnLoft-${v}-mac-arm64.zip`, tar = `SpawnLoft-${v}-mac-arm64.app.tar.gz`
            const checks = [...[dmg, zip, tar].map(file => ({ check: "mac-notarized", file, sha256: sum(file) })), ...[dmg, zip].map(file => ({ check: "trust", file, sha256: sum(file) }))]
            const rec = { format: 1, version: v, release: true, host: `${os.hostname()} (darwin, installer-mac run ${process.env.GITHUB_RUN_ID})`, writtenAt: new Date().toISOString(), commit: process.env.GITHUB_SHA, checks }
            fs.writeFileSync(path.join(dir, "mac-release-record.json"), JSON.stringify(rec, null, 2) + "\n")
            console.log(`${checks.length} checks recorded`)' "$MAC_OUT" "$RELEASE_VERSION"
      - name: The release gate on the mac half (feed signed by a throwaway key; the assembly re-signs)
        env:
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          export TAURI_SIGNING_PRIVATE_KEY="$(cat "$RUNNER_TEMP/bundler.key")"
          v="$RELEASE_VERSION"
          node desktop/release-feed.mjs --out "$RUNNER_TEMP/gate" --version "$v" --pubkey "$RUNNER_TEMP/bundler.pub" --tauri "$TAURI_CLI" \
            --mac-updater "$MAC_OUT/SpawnLoft-$v-mac-arm64.app.tar.gz" --mac-dmg "$MAC_OUT/SpawnLoft-$v-mac-arm64.dmg" --mac-zip "$MAC_OUT/SpawnLoft-$v-mac-arm64.zip" \
            --min-version 2.0.0-beta.1 --date "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          node desktop/release-gate.mjs --dir "$RUNNER_TEMP/gate" --version "$v" --pubkey "$RUNNER_TEMP/bundler.pub" \
            --release --partial --throwaway-key --installed "$APP" --payload "$APP" --evidence "$MAC_OUT/mac-release-record.json"
          ls -la "$MAC_OUT"
      - uses: actions/upload-artifact@v4
        with:
          name: installer-mac-release-${{ inputs.release_version }}
          retention-days: 14
          if-no-files-found: error
          path: ${{ env.MAC_OUT }}/
