name: mac-preview

on:
  workflow_dispatch:
  pull_request:
    paths: ['src/**', 'desktop/**', 'test/**', 'package.json', '.github/workflows/mac-preview.yml']
  push:
    branches: [dev]
    paths: ['src/**', 'desktop/**', 'test/**', 'package.json', '.github/workflows/mac-preview.yml']

permissions:
  contents: read

# Only one publication can replace the rolling Mac downloads at a time.
concurrency:
  group: mac-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            output: mac-arm64
          - runner: macos-15-intel
            arch: x64
            output: mac
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require a development version
        run: node -e "if (!require('./desktop/package.json').version.includes('-')) throw new Error('Mac previews require a prerelease version')"
      - name: Test the core and desktop
        # macOS's default temp path can exceed the Unix socket path limit in fixtures.
        env:
          TMPDIR: /tmp
        run: |
          npm test
          npm --prefix desktop test
      - name: Install the desktop toolchain
        run: npm ci --prefix desktop
      - name: Package the Mac preview
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --config mac-preview.config.cjs --mac --${{ matrix.arch }} --publish never
      - name: Verify the bundle and its ad-hoc signature
        run: |
          node desktop/verify-build.mjs "desktop/dist/${{ matrix.output }}/SpawnLoft.app" --platform=darwin
          codesign --verify --deep --strict "desktop/dist/${{ matrix.output }}/SpawnLoft.app"
      - name: Install the isolated UI test tool
        run: npm install --prefix "$RUNNER_TEMP/mac-smoke" --no-save --no-package-lock playwright@1.63.0
      - name: Open the packaged app and exercise the preview
        env:
          NODE_PATH: ${{ runner.temp }}/mac-smoke/node_modules
        run: node desktop/smoke-mac.cjs "desktop/dist/${{ matrix.output }}/SpawnLoft.app" "desktop/dist/smoke-${{ matrix.arch }}"
      - name: Record architecture, source, and checksums
        run: node desktop/mac-artifacts.mjs ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: mac-preview-${{ matrix.arch }}
          path: |
            desktop/dist/SpawnLoft-*-mac-${{ matrix.arch }}.dmg
            desktop/dist/SpawnLoft-*-mac-${{ matrix.arch }}.zip
            desktop/dist/mac-build-${{ matrix.arch }}.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-smoke-${{ matrix.arch }}
          path: desktop/dist/smoke-${{ matrix.arch }}/

  publish:
    needs: build
    if: github.ref == 'refs/heads/dev' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: mac-preview-*
          path: desktop/dist/mac-release
          merge-multiple: true
      - name: Refresh Mac downloads on the existing prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: node desktop/publish-mac-preview.mjs
