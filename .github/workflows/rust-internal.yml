name: rust-internal

# The checks of the v2 branch (the 2.0 line): the Rust workspace, cargo deny, the core port's
# parity rig against the frozen records, the black-box tests on spawnloft-core, the Node tests of
# the packaging and the panel pages, the Tauri window driven over WebDriver (Linux) and the panel
# in a real browser on all three platforms. It runs on pull requests into v2 and on pushes to v2.
# There is no Node core to test (rust/PLAN-CORE-PORT.md C10): Node runs only the tests and tools
# here, and the bot host.
# It packages nothing and publishes nothing; the 2.0 packages are built by installer.yml,
# installer-mac.yml and installer-linux.yml.
#
# The Electron internal package job that used to end this workflow is gone (panel sign-in design,
# decision 5): 2.0 does not ship Electron, and the panel checks its smoke ran moved to the
# panel-smoke job.
#
# desktop-preview.yml and desktop-stable.yml (the Electron beta and stable pipelines) are retired
# on v2, so merging v2 into dev or main publishes nothing by itself
# (test/no-electron-publish.test.mjs).

on:
  push:
    branches: [v2]
  pull_request:
    branches: [v2]
  workflow_dispatch:

permissions:
  contents: read

# A pull request's newer push replaces its older run. A push to v2 is keyed by its commit and never
# cancelled, so a push two minutes after a merge does not erase the merge's run.
concurrency:
  group: rust-internal-${{ github.event_name == 'pull_request' && github.ref || format('{0}-{1}', github.event_name, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  INTERNAL_BUILD: ${{ github.run_number }}
  SPAWNLOFT_VERSION: 2.0.0-internal.${{ github.run_number }}
  SPAWNLOFT_COMMIT: ${{ github.sha }}

jobs:
  rust:
    # on a pull request github.ref is refs/pull/<n>/merge: without the event test these jobs would
    # skip, and a skipped job reports as passed
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/v2'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, windows-latest, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        # with no argument rustup (1.28+) installs what rust/rust-toolchain.toml pins
        run: rustup toolchain install
      - name: Install the Tauri shell's Linux build libraries (webkit2gtk 4.1, GTK 3)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
      # first-party actions only: the repository's Actions policy allows a fixed list
      # a pull request restores v2's cache but saves none: a PR's cache is scoped to its own ref,
      # so it would only take space (10 GB per repository) from v2's
      - uses: actions/cache@v4
        if: github.event_name != 'pull_request'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          # a fresh key each run so the cache is re-saved; restore-keys picks up the newest one
          key: rust-check-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}-${{ github.run_id }}
          restore-keys: rust-check-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}-
      - uses: actions/cache/restore@v4
        if: github.event_name == 'pull_request'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          # a fresh key each run so the cache is re-saved; restore-keys picks up the newest one
          key: rust-check-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}-${{ github.run_id }}
          restore-keys: rust-check-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}-
      - name: Formatting
        if: matrix.runner == 'ubuntu-24.04'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      # The Tauri window itself, driven through WebDriver (desktop/smoke-tauri.cjs): Linux only,
      # where WebKitWebDriver exists; Windows would need an msedgedriver matching the runner's
      # WebView2, and WKWebView has none.
      - name: Drive the Tauri window (WebDriver, Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y webkit2gtk-driver xvfb
          cargo install tauri-driver --version 2.1.0 --locked
          cargo build -p spawnloft-core -p spawnloft-shell --locked
          cd ..
          xvfb-run -a -s "-screen 0 1920x1080x24" node desktop/smoke-tauri.cjs rust/target/debug/SpawnLoft rust/target/debug/spawnloft-core . smoke-tauri
      - name: Keep the window smoke's logs
        if: failure() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: smoke-tauri-${{ github.run_number }}
          path: smoke-tauri
          retention-days: 14

  deny:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-deny (pinned release, checked against its sha256)
        env:
          DENY_VERSION: 0.20.2
          DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
        run: |
          name="cargo-deny-${DENY_VERSION}-x86_64-unknown-linux-musl"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/deny.tar.gz" "https://github.com/EmbarkStudios/cargo-deny/releases/download/${DENY_VERSION}/${name}.tar.gz"
          echo "${DENY_SHA256}  $RUNNER_TEMP/deny.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/deny.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/${name}" >> "$GITHUB_PATH"
      - name: cargo deny
        working-directory: rust
        run: |
          rustup toolchain install
          cargo deny --version
          cargo deny check

  parity:
    # The core port's parity rig (tools/parity/, rust/PLAN-CORE-PORT.md section 6): every scenario
    # run on the Rust core and compared with what the Node core did, frozen per platform before
    # it left (tools/parity/frozen/): outputs, exit codes, fake-host requests and data trees; the
    # self-tests must find the differences they seed; the golden --json and MCP files must still
    # match. Plus the black-box CLI and MCP tests on the same core. On every pull request, on the
    # three platforms and on Linux arm64.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/v2'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, windows-latest, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # the Node the tests and tools run on; SpawnLoft ships none (rust/PLAN-CORE-PORT.md 5.5)
          node-version-file: .node-version
      - name: Install the pinned toolchain
        working-directory: rust
        run: rustup toolchain install
      # a pull request restores v2's cache but saves none (see the rust job)
      - uses: actions/cache@v4
        if: github.event_name != 'pull_request'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-parity-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}-${{ github.run_id }}
          restore-keys: rust-parity-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}-
      - uses: actions/cache/restore@v4
        if: github.event_name == 'pull_request'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-parity-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}-${{ github.run_id }}
          restore-keys: rust-parity-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}-
      - name: Build spawnloft-core with the test hooks, and the scheduler stand-in
        working-directory: rust
        run: |
          cargo build --locked -p spawnloft-core --features test-hooks
          cargo build --locked -p spawnloft-fakes --bin fake-scheduler
          exe=; [ "$RUNNER_OS" = Windows ] && exe=.exe
          echo "SPAWNLOFT_CORE_BIN=$GITHUB_WORKSPACE/rust/target/debug/spawnloft-core$exe" >> "$GITHUB_ENV""
      - name: The library's tests with the test hooks on
        working-directory: rust
        run: cargo test --locked -p spawnloft-lib --features test-hooks
      - name: The parity rig
        env:
          TMPDIR: ${{ runner.temp }}
        run: node tools/parity/run.mjs --core "$SPAWNLOFT_CORE_BIN" --out parity-report
      - name: The rig's own tests, and the CLI and MCP tests on the Rust core
        env:
          TMPDIR: ${{ runner.temp }}
        run: node --test --test-concurrency=1 test/parity-rig.test.mjs test/parity-frozen.test.mjs test/mcp.test.mjs test/cli.test.mjs test/data-command.test.mjs test/diag-cli.test.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: parity-report-${{ github.run_number }}-${{ runner.os }}-${{ runner.arch }}
          retention-days: 14
          path: parity-report/

  zip-fuzz:
    # The cargo-fuzz targets of the zip readers (rust/fuzz), a minute each, seeded with archives
    # the Rust writer makes. Nightly is pinned by date; the targets never ship.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NIGHTLY: nightly-2026-11-01
      CARGO_FUZZ_VERSION: 0.13.2
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned nightly and cargo-fuzz
        working-directory: rust
        run: |
          rustup toolchain install "$NIGHTLY" --profile minimal
          rustup toolchain install
          cargo install cargo-fuzz --locked --version "$CARGO_FUZZ_VERSION"
      - name: Seed archives from the Rust writer
        working-directory: rust
        run: |
          cargo build --locked -p spawnloft-fakes --bin zip-probe
          seed="$RUNNER_TEMP/seed"; mkdir -p "$seed/src/w/d" fuzz/corpus/zip_read
          printf 'level %.0s' $(seq 500) > "$seed/src/w/level.dat"
          echo hi > "$seed/src/w/d/ü.txt"; : > "$seed/src/w/empty"
          for z in "" --zip64; do
            target/debug/zip-probe create "fuzz/corpus/zip_read/rust$z.zip" "$seed/src" $z -- w
          done
      - name: Fuzz the zip readers
        working-directory: rust/fuzz
        run: |
          cargo "+$NIGHTLY" fuzz run zip_read corpus/zip_read -- -max_total_time=60 -rss_limit_mb=2048
          cargo "+$NIGHTLY" fuzz run zip_inflate -- -max_total_time=60 -rss_limit_mb=2048
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: zip-fuzz-${{ github.run_number }}
          retention-days: 14
          path: rust/fuzz/artifacts/

  musl-network:
    # The C1 network checks (rust/PLAN-CORE-PORT.md, phase C1): the static musl build resolves
    # names and makes TLS connections with its bundled roots, on x64 and arm64, on the runner and
    # in containers with no CA store; and it ignores proxy variables, as Node's fetch does.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/v2'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            triple: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            triple: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      URLS: https://piston-meta.mojang.com/mc/game/version_manifest_v2.json https://github.com/joogiebear/spawnloft
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Install the pinned toolchain, the static target and the musl C compiler
        working-directory: rust
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.triple }}
          sudo apt-get update
          sudo apt-get install -y musl-tools
          triple='${{ matrix.triple }}'
          echo "CC_${triple//-/_}=musl-gcc" >> "$GITHUB_ENV"
      - name: Build the probe static
        working-directory: rust
        run: |
          cargo build --locked --release -p spawnloft-fakes --bin net-probe --target ${{ matrix.triple }}
          probe="$GITHUB_WORKSPACE/rust/target/${{ matrix.triple }}/release/net-probe"
          file "$probe"
          file "$probe" | grep -Eq 'static(ally|-pie) linked'
          echo "PROBE=$probe" >> "$GITHUB_ENV"
      - name: Names and TLS on the runner
        run: $PROBE $URLS
      - name: Names and TLS with no CA store (Debian slim, Alpine)
        run: |
          for image in debian:12-slim alpine:3.20; do
            # whatever store the image has is removed first: the probe must not need one
            docker run --rm -v "$PROBE:/probe:ro" "$image" sh -c 'rm -rf /etc/ssl /usr/share/ca-certificates /etc/ca-certificates && exec /probe "$@"' probe $URLS
          done
      - name: Proxy variables are ignored by both sides
        run: |
          refuse=http://127.0.0.1:9
          for v in ALL_PROXY all_proxy HTTPS_PROXY https_proxy HTTP_PROXY http_proxy; do export "$v=$refuse"; done
          unset NO_PROXY no_proxy
          $PROBE $URLS
          for url in $URLS; do
            node -e 'fetch(process.argv[1]).then(r => { if (!r.ok) process.exit(1); console.log(JSON.stringify({ url: process.argv[1], status: r.status })) })' "$url"
          done

  real-servers:
    # C4's last check (rust/PLAN-CORE-PORT.md): the Rust core makes a real Paper and a real Fabric
    # server from the real download hosts, with the checksums and size floors the parity rig
    # proves against fakes, and asks Paper's API whether there is a newer build.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SPAWNLOFT_DATA_ROOT: ${{ github.workspace }}/../sl-real/data
      MC: 1.21.4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install the pinned toolchain
        working-directory: rust
        run: rustup toolchain install
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-daemon-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}-${{ github.run_id }}
          restore-keys: rust-daemon-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}-
      - name: Build spawnloft-core
        working-directory: rust
        run: cargo build --release --locked -p spawnloft-core
      - name: A real Paper and a real Fabric server
        run: |
          core="$GITHUB_WORKSPACE/rust/target/release/spawnloft-core"
          mkdir -p "$SPAWNLOFT_DATA_ROOT"
          "$core" new real-paper --paper "$MC" --java java --accept-eula
          "$core" new real-fabric --fabric "$MC" --java java --accept-eula
          "$core" upgrade real-paper --check
          "$core" list
          "$core" jars
          for jar in "$SPAWNLOFT_DATA_ROOT"/instances/real-paper/paper-"$MC"-*.jar "$SPAWNLOFT_DATA_ROOT"/instances/real-fabric/fabric-server-mc."$MC"-*.jar; do
            test -s "$jar" || { echo "::error::$jar is missing or empty"; exit 1; }
            unzip -tq "$jar" >/dev/null || { echo "::error::$jar is not a whole jar"; exit 1; }
          done

  node:
    # The Node tests that remain (packaging, the panel pages, the rig's own; the ones that need a
    # spawnloft-core skip without one and run in the parity job), and the desktop tests, once per
    # platform.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/v2'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # the Node the tests and tools run on; SpawnLoft ships none (rust/PLAN-CORE-PORT.md 5.5)
          node-version-file: .node-version
      - name: Core and desktop tests
        env:
          TMPDIR: /tmp
          MAC_SIGNING_MODE: ad-hoc
        run: |
          npm test
          npm --prefix desktop test

  panel-smoke:
    # The panel in a real browser on each platform (desktop/smoke-panel.cjs): signing in through
    # `spawnloft ui`, the console, live performance charts, backups, the file editor, the console
    # window, managed MySQL and Redis, the scheduler on macOS, a restart that ends the old tab's
    # session, and `spawnloft ui --link`, on the Rust daemon. It took these checks over from the
    # retired Electron package job (desktop/smoke-desktop.cjs), which 2.0 does not ship.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/v2'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, windows-latest, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # the Node the tests and tools run on; SpawnLoft ships none (rust/PLAN-CORE-PORT.md 5.5)
          node-version-file: .node-version
      - name: Install the pinned toolchain
        working-directory: rust
        run: rustup toolchain install
      # a pull request restores v2's cache but saves none: a PR's cache is scoped to its own ref,
      # so it would only take space (10 GB per repository) from v2's
      - uses: actions/cache@v4
        if: github.event_name != 'pull_request'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-daemon-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}-${{ github.run_id }}
          restore-keys: rust-daemon-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}-
      - uses: actions/cache/restore@v4
        if: github.event_name == 'pull_request'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-daemon-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}-${{ github.run_id }}
          restore-keys: rust-daemon-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}-
      - name: Build spawnloft-core
        working-directory: rust
        run: |
          cargo build --release --locked -p spawnloft-core
          exe=spawnloft-core; [ "$RUNNER_OS" = Windows ] && exe=spawnloft-core.exe
          echo "SPAWNLOFT_CORE_BIN=$GITHUB_WORKSPACE/rust/target/release/$exe" >> "$GITHUB_ENV"
      - name: Install the isolated browser test tool and its Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/panel-smoke" --no-save --no-package-lock playwright@1.63.0
          deps=; [ "$RUNNER_OS" = Linux ] && deps=--with-deps
          "$RUNNER_TEMP/panel-smoke/node_modules/.bin/playwright" install $deps chromium
      - name: The panel in a browser
        env:
          NODE_PATH: ${{ runner.temp }}/panel-smoke/node_modules
          SPAWNLOFT_DAEMON: rust
        run: node desktop/smoke-panel.cjs "smoke-panel-${{ runner.os }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-panel-${{ github.run_number }}-${{ runner.os }}
          retention-days: 14
          path: smoke-panel-${{ runner.os }}/
