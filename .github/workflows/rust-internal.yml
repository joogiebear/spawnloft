name: rust-internal

# Internal builds of the v2 branch: the Rust core inside the Electron app, for Victor's own
# machines only (PLAN-RUST-TAURI.md section 13). Nothing here reaches a beta or a release:
#
# - it runs on pushes to v2 (and by hand, on v2 only), never on dev, main or a pull request;
# - it has no publish job, writes no feed, makes no tag and no release, and holds no secrets;
# - its packages are workflow artifacts kept for 14 days, versioned 2.0.0-internal.<run>;
# - Windows builds are unsigned and Mac builds ad-hoc signed (CI signing only trusts dev pushes);
# - the app's update check is off in these builds (desktop/internal.config.cjs).
#
# desktop-preview.yml is untouched: its push trigger is dev only and its publish job checks
# refs/heads/dev, so a push here cannot reach it.

on:
  push:
    branches: [v2]
  workflow_dispatch:
    inputs:
      repeat:
        description: Times to run the daemon suites in a row in one job (5 for the R1 gate)
        default: '1'

permissions:
  contents: read

concurrency:
  group: rust-internal-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  INTERNAL_BUILD: ${{ github.run_number }}
  SPAWNLOFT_VERSION: 2.0.0-internal.${{ github.run_number }}
  SPAWNLOFT_COMMIT: ${{ github.sha }}

jobs:
  rust:
    if: github.ref == 'refs/heads/v2'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, windows-latest, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        # with no argument rustup (1.28+) installs what rust/rust-toolchain.toml pins
        run: rustup toolchain install
      - name: Install the Tauri shell's Linux build libraries (webkit2gtk 4.1, GTK 3)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
      # first-party actions only: the repository's Actions policy allows a fixed list
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          # a fresh key each run so the cache is re-saved; restore-keys picks up the newest one
          key: rust-check-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}-${{ github.run_id }}
          restore-keys: rust-check-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}-
      - name: Formatting
        if: matrix.runner == 'ubuntu-24.04'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked

  deny:
    if: github.ref == 'refs/heads/v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-deny (pinned release, checked against its sha256)
        env:
          DENY_VERSION: 0.20.2
          DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
        run: |
          name="cargo-deny-${DENY_VERSION}-x86_64-unknown-linux-musl"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/deny.tar.gz" "https://github.com/EmbarkStudios/cargo-deny/releases/download/${DENY_VERSION}/${name}.tar.gz"
          echo "${DENY_SHA256}  $RUNNER_TEMP/deny.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/deny.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/${name}" >> "$GITHUB_PATH"
      - name: cargo deny
        working-directory: rust
        run: |
          rustup toolchain install
          cargo deny --version
          cargo deny check

  daemons:
    # R1 (P0-D): the daemon suites under both daemons, on Windows and Linux. The rust leg builds
    # spawnloft-core and points the supervisor at it; daemon-contract.test.mjs checks that the
    # daemon answering ping really is the Rust one, so a silent fallback to daemon.mjs fails here.
    if: github.ref == 'refs/heads/v2'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, windows-latest]
        daemon: [node, rust]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      SPAWNLOFT_DAEMON: ${{ matrix.daemon }}
      REPEAT: ${{ inputs.repeat || '1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the pinned toolchain
        if: matrix.daemon == 'rust'
        working-directory: rust
        run: rustup toolchain install
      - uses: actions/cache@v4
        if: matrix.daemon == 'rust'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-daemon-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}-${{ github.run_id }}
          restore-keys: rust-daemon-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}-
      - name: Build spawnloft-core
        if: matrix.daemon == 'rust'
        working-directory: rust
        run: |
          cargo build --release --locked -p spawnloft-core
          exe=spawnloft-core; [ "$RUNNER_OS" = Windows ] && exe=spawnloft-core.exe
          echo "SPAWNLOFT_CORE_BIN=$GITHUB_WORKSPACE/rust/target/release/$exe" >> "$GITHUB_ENV"
      - name: Daemon suites under the ${{ matrix.daemon }} daemon
        env:
          TMPDIR: /tmp
        run: |
          files="lifecycle active-guard active-guard-uninstall databases databases-garnet metrics metrics-linux crashguard notify daemon-contract contracts-daemon"
          for i in $(seq 1 "$REPEAT"); do
            echo "::group::run $i of $REPEAT"
            for f in $files; do
              node --test --test-concurrency=1 "test/$f.test.mjs" || { echo "::error::run $i: $f failed under the ${{ matrix.daemon }} daemon"; exit 1; }
            done
            echo "::endgroup::"
            echo "run $i of $REPEAT green"
          done

  node:
    # The whole Node suite, once per platform, on the default daemon.
    if: github.ref == 'refs/heads/v2'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Core and desktop tests
        env:
          TMPDIR: /tmp
          MAC_SIGNING_MODE: ad-hoc
        run: |
          npm test
          npm --prefix desktop test

  tauri-spike:
    # P0-F: the Tauri 2 shell over the panel, packaged with SpawnLoft's NSIS template, installed
    # over a published 1.6 beta the way electron-updater does it, one Tauri updater cycle
    # (spike-a -> spike-b) and start/memory numbers against 1.6. Unsigned installers, a throwaway
    # updater key made here, a loopback feed: nothing leaves the runner except workflow artifacts.
    if: github.ref == 'refs/heads/v2'
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      SPIKE_A: 2.0.0-spike.1
      SPIKE_B: 2.0.0-spike.2
      # the 1.6 beta installed first; any signed 1.6 beta with a Windows installer will do
      BETA_TAG: v1.6.0-beta.413
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the pinned toolchain
        working-directory: rust
        run: rustup toolchain install
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-spike-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}-${{ github.run_id }}
          restore-keys: rust-spike-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}-
      - name: Build spawnloft-core (the panel endpoint the shell opens)
        working-directory: rust
        run: cargo build --release --locked -p spawnloft-core
      - name: Install the Tauri CLI (pinned, from npm)
        run: npm install --prefix "$RUNNER_TEMP/tauri-cli" --no-save --no-package-lock @tauri-apps/cli@2.12.4
      - name: A throwaway updater key for this run
        run: |
          tauri="$RUNNER_TEMP/tauri-cli/node_modules/.bin/tauri"
          "$tauri" signer generate --ci -p "" -w "$RUNNER_TEMP/spike.key" -f
          ls -la "$RUNNER_TEMP"/spike.key*
      - name: Build spike-a and spike-b
        working-directory: rust/crates/spawnloft-shell
        env:
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          export TAURI_SIGNING_PRIVATE_KEY="$(cat "$RUNNER_TEMP/spike.key")"
          tauri="$RUNNER_TEMP/tauri-cli/node_modules/.bin/tauri"
          mkdir -p "$RUNNER_TEMP/feed"
          for v in "$SPIKE_A" "$SPIKE_B"; do
            node spike/spike-config.mjs "$v" "$RUNNER_TEMP/spike.key.pub" "$RUNNER_TEMP/spike-$v.json"
            SPAWNLOFT_VERSION="$v" "$tauri" build --ci --bundles nsis --config "$RUNNER_TEMP/spike-$v.json"
            cp ../../target/release/bundle/nsis/SpawnLoft_${v}_x64-setup.exe* "$RUNNER_TEMP/feed/"
          done
          ls -la "$RUNNER_TEMP/feed"
      - name: Download the signed 1.6 beta installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$BETA_TAG" -R "$GITHUB_REPOSITORY" -p 'SpawnLoft-Setup-*.exe' -D "$RUNNER_TEMP/beta"
      - name: Install 1.6 and measure it
        shell: pwsh
        run: |
          $setup = Get-ChildItem "$env:RUNNER_TEMP\beta" -Filter 'SpawnLoft-Setup-*.exe' | Select-Object -First 1
          $p = Start-Process $setup.FullName -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "1.6 installer exit $($p.ExitCode)" }
          # point its updater at nothing (PLAN-RUST-TAURI s3 item 4: app-update.yml is the switch),
          # so a newer 1.6 beta cannot install itself while this job measures or hands over
          Set-Content "$env:LOCALAPPDATA\Programs\SpawnLoft\resources\app-update.yml" "provider: generic`nurl: http://127.0.0.1:9/`nupdaterCacheDirName: spawnloft-updater"
          # a configured data root, so 1.6 opens on the panel and not on its first-run page
          New-Item -ItemType Directory -Force "$env:APPDATA\mcctl", "$env:LOCALAPPDATA\mcctl" | Out-Null
          @{ dataRoot = "$env:LOCALAPPDATA\mcctl" } | ConvertTo-Json | Set-Content "$env:APPDATA\mcctl\settings.json"
          npm install --prefix "$env:RUNNER_TEMP\pw" --no-save --no-package-lock playwright@1.63.0
          $env:NODE_PATH = "$env:RUNNER_TEMP\pw\node_modules"
          New-Item -ItemType Directory -Force spike-results | Out-Null
          node rust/crates/spawnloft-shell/spike/measure.cjs electron "$env:LOCALAPPDATA\Programs\SpawnLoft\SpawnLoft.exe" spike-results/measure-electron-1.6.json 3
          @{ installerBytes = $setup.Length; name = $setup.Name } | ConvertTo-Json | Set-Content spike-results/installer-1.6.json
      - name: Hand over from 1.6 to spike-a the way electron-updater does
        shell: pwsh
        run: |
          $a = Get-ChildItem "$env:RUNNER_TEMP\feed" -Filter "SpawnLoft_$($env:SPIKE_A)_x64-setup.exe"
          ./rust/crates/spawnloft-shell/spike/handover.ps1 -SpikeA $a.FullName -Out spike-results
          @{ installerBytes = $a.Length; name = $a.Name } | ConvertTo-Json | Set-Content spike-results/installer-spike.json
      - name: Measure the Tauri shell
        shell: pwsh
        run: node rust/crates/spawnloft-shell/spike/measure.cjs tauri "$env:LOCALAPPDATA\Programs\SpawnLoft\SpawnLoft.exe" spike-results/measure-tauri.json 3
      - name: One Tauri updater cycle, spike-a to spike-b
        shell: pwsh
        run: ./rust/crates/spawnloft-shell/spike/update-cycle.ps1 -FeedDir "$env:RUNNER_TEMP\feed" -From $env:SPIKE_A -To $env:SPIKE_B -Out spike-results
      - name: Uninstall (keeps data, removes tasks)
        shell: pwsh
        run: ./rust/crates/spawnloft-shell/spike/handover.ps1 -Uninstall -Out spike-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tauri-spike-${{ github.run_number }}-results
          retention-days: 14
          path: spike-results/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tauri-spike-${{ github.run_number }}-installers
          retention-days: 14
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/feed/*.exe
            ${{ runner.temp }}/feed/*.sig

  package:
    if: github.ref == 'refs/heads/v2'
    needs: [rust, deny, node, daemons]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: win32
            target: win
            arch: x64
            triple: x86_64-pc-windows-msvc
            exe: spawnloft-core.exe
            app: desktop/dist/win-unpacked
          - runner: macos-15
            platform: darwin
            target: mac
            arch: arm64
            triple: aarch64-apple-darwin
            exe: spawnloft-core
            app: desktop/dist/mac-arm64/SpawnLoft.app
          # musl: one static binary with no glibc floor, so it runs on the oldest distribution
          # the spawnloft-cli package claims (glibc 2.28) as well as on this runner
          - runner: ubuntu-24.04
            platform: linux
            target: linux
            arch: x64
            triple: x86_64-unknown-linux-musl
            exe: spawnloft-core
            app: desktop/dist/linux-unpacked
            wrap: xvfb-run -a
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      MAC_SIGNING_MODE: ad-hoc
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the pinned toolchain and target
        working-directory: rust
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.triple }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-release-${{ matrix.triple }}-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}-${{ github.run_id }}
          restore-keys: rust-release-${{ matrix.triple }}-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}-
      - name: Build spawnloft-core
        working-directory: rust
        run: cargo build --release --locked -p spawnloft-core --target ${{ matrix.triple }}
      - name: Stage it for packaging
        run: node desktop/stage-core.mjs "rust/target/${{ matrix.triple }}/release/${{ matrix.exe }}"
      - name: Install the desktop toolchain
        run: npm ci --prefix desktop
      - name: Install the rpm build tool
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Package the internal build
        working-directory: desktop
        run: npx electron-builder --config internal.config.cjs --${{ matrix.target }} --${{ matrix.arch }} --publish never
      - name: Verify the packaged app
        run: node desktop/verify-build.mjs "${{ matrix.app }}" --platform=${{ matrix.platform }} --config=desktop/internal.config.cjs
      - name: Verify the Mac ad-hoc signature covers the core
        if: matrix.platform == 'darwin'
        run: |
          node desktop/verify-mac-signing.cjs "${{ matrix.app }}"
          codesign --verify --strict --verbose=2 "${{ matrix.app }}/Contents/MacOS/spawnloft-core"
          "${{ matrix.app }}/Contents/MacOS/spawnloft-core" --version
      - name: Nothing to publish was produced
        # no feed files: an internal build must never be something an updater could be pointed at
        run: |
          if ls desktop/dist/*.yml 2>/dev/null | grep -v builder-; then
            echo "::error::an updater feed file was written"; exit 1
          fi
      - name: Install the desktop package the way a user would
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get install -y xvfb ./desktop/dist/SpawnLoft-*-linux-amd64.deb
          test -x /opt/SpawnLoft/resources/bin/spawnloft-core
          grep -q '"daemon":"rust"' /opt/SpawnLoft/resources/core/internal-defaults.json
          /opt/SpawnLoft/resources/bin/spawnloft-core --version
          /usr/bin/spawnloft config
      - name: Build the command-line packages
        if: matrix.platform == 'linux'
        run: node desktop/build-cli-package.mjs
      - name: Install the command-line package where there is no Node, and run a server
        if: matrix.platform == 'linux'
        run: |
          docker run --rm -v "$PWD:/repo:ro" ubuntu:22.04 sh -ec '
            sh /repo/desktop/smoke-cli-package.sh deb
            /opt/spawnloft-cli/bin/spawnloft-core --version
          '
          docker run --rm -v "$PWD:/repo:ro" rockylinux:9 sh -ec '
            dnf install -y -q /repo/desktop/dist/spawnloft-cli-*.rpm
            /opt/spawnloft-cli/bin/spawnloft-core --version
          '
      - name: Install the isolated UI test tool
        run: npm install --prefix "$RUNNER_TEMP/desktop-smoke" --no-save --no-package-lock playwright@1.63.0
      - name: Open the packaged app and exercise the shared regressions
        env:
          NODE_PATH: ${{ runner.temp }}/desktop-smoke/node_modules
        run: ${{ matrix.wrap }} node desktop/smoke-desktop.cjs "${{ matrix.platform == 'linux' && '/opt/SpawnLoft' || matrix.app }}" "desktop/dist/smoke-${{ matrix.platform }}-${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: spawnloft-internal-${{ github.run_number }}-${{ matrix.platform }}-${{ matrix.arch }}
          retention-days: 14
          if-no-files-found: error
          path: |
            desktop/dist/SpawnLoft-Setup-*.exe
            desktop/dist/SpawnLoft-*-mac-${{ matrix.arch }}.dmg
            desktop/dist/SpawnLoft-*-mac-${{ matrix.arch }}.zip
            desktop/dist/SpawnLoft-*-linux-*.deb
            desktop/dist/SpawnLoft-*-linux-*.rpm
            desktop/dist/spawnloft-cli-*.deb
            desktop/dist/spawnloft-cli-*.rpm
            desktop/dist/build-info.json
      - name: Keep the unpacked Windows app (runs without installing over the 1.x beta)
        if: matrix.platform == 'win32'
        uses: actions/upload-artifact@v4
        with:
          name: spawnloft-internal-${{ github.run_number }}-win32-x64-portable
          retention-days: 14
          if-no-files-found: error
          path: desktop/dist/win-unpacked/
      - name: Keep the bare core binary too
        uses: actions/upload-artifact@v4
        with:
          name: spawnloft-core-${{ github.run_number }}-${{ matrix.platform }}-${{ matrix.arch }}
          retention-days: 14
          if-no-files-found: error
          path: rust/target/${{ matrix.triple }}/release/${{ matrix.exe }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spawnloft-internal-smoke-${{ github.run_number }}-${{ matrix.platform }}-${{ matrix.arch }}
          retention-days: 14
          path: desktop/dist/smoke-${{ matrix.platform }}-${{ matrix.arch }}/
