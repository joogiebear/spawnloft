name: rust-internal

# The checks of the v2 branch (the 2.0 line): the Rust workspace, cargo deny, the daemon suites
# under both daemons, the Node suite, the Tauri window driven over WebDriver (Linux) and the panel
# in a real browser on all three platforms. It runs on pull requests into v2 and on pushes to v2.
# It packages nothing and publishes nothing; the 2.0 packages are built by installer.yml,
# installer-mac.yml and installer-linux.yml.
#
# The Electron internal package job that used to end this workflow is gone (panel sign-in design,
# decision 5): 2.0 does not ship Electron, and the panel checks its smoke ran moved to the
# panel-smoke job.
#
# desktop-preview.yml and desktop-stable.yml (the Electron beta and stable pipelines) are retired
# on v2, so merging v2 into dev or main publishes nothing by itself
# (test/no-electron-publish.test.mjs).

on:
  push:
    branches: [v2]
  pull_request:
    branches: [v2]
  workflow_dispatch:
    inputs:
      repeat:
        description: Times to run the daemon suites in a row in one job (5 for the R1 gate)
        default: '1'

permissions:
  contents: read

# A pull request's newer push replaces its older run. A push to v2 is keyed by its commit and never
# cancelled, so a push two minutes after a merge does not erase the merge's run.
concurrency:
  group: rust-internal-${{ github.event_name == 'pull_request' && github.ref || format('{0}-{1}', github.event_name, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  INTERNAL_BUILD: ${{ github.run_number }}
  SPAWNLOFT_VERSION: 2.0.0-internal.${{ github.run_number }}
  SPAWNLOFT_COMMIT: ${{ github.sha }}

jobs:
  rust:
    # on a pull request github.ref is refs/pull/<n>/merge: without the event test these jobs would
    # skip, and a skipped job reports as passed
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/v2'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, windows-latest, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        # with no argument rustup (1.28+) installs what rust/rust-toolchain.toml pins
        run: rustup toolchain install
      - name: Install the Tauri shell's Linux build libraries (webkit2gtk 4.1, GTK 3)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
      # first-party actions only: the repository's Actions policy allows a fixed list
      # a pull request restores v2's cache but saves none: a PR's cache is scoped to its own ref,
      # so it would only take space (10 GB per repository) from v2's
      - uses: actions/cache@v4
        if: github.event_name != 'pull_request'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          # a fresh key each run so the cache is re-saved; restore-keys picks up the newest one
          key: rust-check-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}-${{ github.run_id }}
          restore-keys: rust-check-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}-
      - uses: actions/cache/restore@v4
        if: github.event_name == 'pull_request'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          # a fresh key each run so the cache is re-saved; restore-keys picks up the newest one
          key: rust-check-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}-${{ github.run_id }}
          restore-keys: rust-check-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}-
      - name: Formatting
        if: matrix.runner == 'ubuntu-24.04'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      # The Tauri window itself, driven through WebDriver (desktop/smoke-tauri.cjs): Linux only,
      # where WebKitWebDriver exists; Windows would need an msedgedriver matching the runner's
      # WebView2, and WKWebView has none.
      - name: Drive the Tauri window (WebDriver, Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y webkit2gtk-driver xvfb
          cargo install tauri-driver --version 2.1.0 --locked
          cargo build -p spawnloft-core -p spawnloft-shell --locked
          cd ..
          xvfb-run -a -s "-screen 0 1920x1080x24" node desktop/smoke-tauri.cjs rust/target/debug/SpawnLoft rust/target/debug/spawnloft-core . smoke-tauri
      - name: Keep the window smoke's logs
        if: failure() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: smoke-tauri-${{ github.run_number }}
          path: smoke-tauri
          retention-days: 14

  deny:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-deny (pinned release, checked against its sha256)
        env:
          DENY_VERSION: 0.20.2
          DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
        run: |
          name="cargo-deny-${DENY_VERSION}-x86_64-unknown-linux-musl"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/deny.tar.gz" "https://github.com/EmbarkStudios/cargo-deny/releases/download/${DENY_VERSION}/${name}.tar.gz"
          echo "${DENY_SHA256}  $RUNNER_TEMP/deny.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/deny.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/${name}" >> "$GITHUB_PATH"
      - name: cargo deny
        working-directory: rust
        run: |
          rustup toolchain install
          cargo deny --version
          cargo deny check

  daemons:
    # R1 (P0-D): the daemon suites under both daemons, on Windows and Linux. The rust leg builds
    # spawnloft-core and points the supervisor at it; daemon-contract.test.mjs checks that the
    # daemon answering ping really is the Rust one, so a silent fallback to daemon.mjs fails here.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/v2'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, windows-latest]
        daemon: [node, rust]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      SPAWNLOFT_DAEMON: ${{ matrix.daemon }}
      REPEAT: ${{ inputs.repeat || '1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # the Node SpawnLoft ships (desktop/node-pin.mjs NODE_VERSION, plan D7)
          node-version-file: .node-version
      - name: Install the pinned toolchain
        if: matrix.daemon == 'rust'
        working-directory: rust
        run: rustup toolchain install
      # a pull request restores v2's cache but saves none: a PR's cache is scoped to its own ref,
      # so it would only take space (10 GB per repository) from v2's
      - uses: actions/cache@v4
        if: matrix.daemon == 'rust' && github.event_name != 'pull_request'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-daemon-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}-${{ github.run_id }}
          restore-keys: rust-daemon-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}-
      - uses: actions/cache/restore@v4
        if: matrix.daemon == 'rust' && github.event_name == 'pull_request'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-daemon-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}-${{ github.run_id }}
          restore-keys: rust-daemon-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}-
      - name: Build spawnloft-core
        if: matrix.daemon == 'rust'
        working-directory: rust
        run: |
          cargo build --release --locked -p spawnloft-core
          exe=spawnloft-core; [ "$RUNNER_OS" = Windows ] && exe=spawnloft-core.exe
          echo "SPAWNLOFT_CORE_BIN=$GITHUB_WORKSPACE/rust/target/release/$exe" >> "$GITHUB_ENV"
      - name: Daemon suites under the ${{ matrix.daemon }} daemon
        env:
          TMPDIR: /tmp
        run: |
          files="lifecycle active-guard active-guard-uninstall databases databases-garnet metrics metrics-linux crashguard notify daemon-contract contracts-daemon"
          for i in $(seq 1 "$REPEAT"); do
            echo "::group::run $i of $REPEAT"
            for f in $files; do
              node --test --test-concurrency=1 "test/$f.test.mjs" || { echo "::error::run $i: $f failed under the ${{ matrix.daemon }} daemon"; exit 1; }
            done
            echo "::endgroup::"
            echo "run $i of $REPEAT green"
          done

  node:
    # The whole Node suite, once per platform, on the default daemon.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/v2'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # the Node SpawnLoft ships (desktop/node-pin.mjs NODE_VERSION, plan D7)
          node-version-file: .node-version
      - name: Core and desktop tests
        env:
          TMPDIR: /tmp
          MAC_SIGNING_MODE: ad-hoc
        run: |
          npm test
          npm --prefix desktop test

  panel-smoke:
    # The panel in a real browser on each platform (desktop/smoke-panel.cjs): signing in through
    # `spawnloft ui`, the console, live performance charts, backups, the file editor, the console
    # window, managed MySQL and Redis, the scheduler on macOS, a restart that ends the old tab's
    # session, and `spawnloft ui --link`, on the Rust daemon. It took these checks over from the
    # retired Electron package job (desktop/smoke-desktop.cjs), which 2.0 does not ship.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/v2'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, windows-latest, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # the Node SpawnLoft ships (desktop/node-pin.mjs NODE_VERSION, plan D7)
          node-version-file: .node-version
      - name: Install the pinned toolchain
        working-directory: rust
        run: rustup toolchain install
      # a pull request restores v2's cache but saves none: a PR's cache is scoped to its own ref,
      # so it would only take space (10 GB per repository) from v2's
      - uses: actions/cache@v4
        if: github.event_name != 'pull_request'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-daemon-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}-${{ github.run_id }}
          restore-keys: rust-daemon-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}-
      - uses: actions/cache/restore@v4
        if: github.event_name == 'pull_request'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-daemon-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}-${{ github.run_id }}
          restore-keys: rust-daemon-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}-
      - name: Build spawnloft-core
        working-directory: rust
        run: |
          cargo build --release --locked -p spawnloft-core
          exe=spawnloft-core; [ "$RUNNER_OS" = Windows ] && exe=spawnloft-core.exe
          echo "SPAWNLOFT_CORE_BIN=$GITHUB_WORKSPACE/rust/target/release/$exe" >> "$GITHUB_ENV"
      - name: Install the isolated browser test tool and its Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/panel-smoke" --no-save --no-package-lock playwright@1.63.0
          deps=; [ "$RUNNER_OS" = Linux ] && deps=--with-deps
          "$RUNNER_TEMP/panel-smoke/node_modules/.bin/playwright" install $deps chromium
      - name: The panel in a browser
        env:
          NODE_PATH: ${{ runner.temp }}/panel-smoke/node_modules
          SPAWNLOFT_DAEMON: rust
        run: node desktop/smoke-panel.cjs "smoke-panel-${{ runner.os }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-panel-${{ github.run_number }}-${{ runner.os }}
          retention-days: 14
          path: smoke-panel-${{ runner.os }}/
