name: desktop-preview

on:
  workflow_dispatch:
  pull_request:
    paths: ['src/**', 'desktop/**', 'test/**', 'mcctl.mjs', 'spawnloft.mjs', 'package.json', '.github/workflows/desktop-preview.yml']
  push:
    branches: [dev]
    paths: ['src/**', 'desktop/**', 'test/**', 'mcctl.mjs', 'spawnloft.mjs', 'package.json', '.github/workflows/desktop-preview.yml']

permissions:
  contents: read

concurrency:
  group: desktop-preview-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release-policy:
    runs-on: ubuntu-latest
    outputs:
      mac-signing-mode: ${{ steps.mode.outputs.value }}
      enabled: ${{ steps.version.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: node -e "require('fs').appendFileSync(process.env.GITHUB_OUTPUT, 'enabled=' + require('./desktop/package.json').version.includes('-') + '\n')"
      - id: mode
        env:
          ENABLED: ${{ vars.MAC_SIGNING_ENABLED }}
          TRUSTED: ${{ github.ref == 'refs/heads/dev' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        run: |
          if [[ "$TRUSTED" == "true" && "$ENABLED" == "true" ]]; then
            echo 'value=signed' >> "$GITHUB_OUTPUT"
          else
            echo 'value=ad-hoc' >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: release-policy
    if: needs.release-policy.outputs.enabled == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: win32
            target: win
            arch: x64
            app: desktop/dist/win-unpacked
            smoke: desktop/dist/win-unpacked
          - runner: macos-15
            platform: darwin
            target: mac
            arch: arm64
            app: desktop/dist/mac-arm64/SpawnLoft.app
            smoke: desktop/dist/mac-arm64/SpawnLoft.app
          - runner: macos-15-intel
            platform: darwin
            target: mac
            arch: x64
            app: desktop/dist/mac/SpawnLoft.app
            smoke: desktop/dist/mac/SpawnLoft.app
          # Pinned to 24.04 rather than -latest: it is the release whose AppArmor policy blocks
          # Chromium's sandbox for programs without a profile, which is the thing worth testing.
          - runner: ubuntu-24.04
            platform: linux
            target: linux
            arch: x64
            app: desktop/dist/linux-unpacked
            # The smoke test opens the INSTALLED app, not the unpacked folder: see the install step.
            smoke: /opt/SpawnLoft
            wrap: xvfb-run -a
            deb: amd64
          # GitHub's arm64 Linux runner. Managed MySQL has no arm64 build, so the smoke test checks
          # that it is not offered there and runs everything else, Redis included.
          - runner: ubuntu-24.04-arm
            platform: linux
            target: linux
            arch: arm64
            app: desktop/dist/linux-arm64-unpacked
            smoke: /opt/SpawnLoft
            wrap: xvfb-run -a
            deb: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      PREVIEW_BUILD: ${{ github.run_number }}
      MAC_SIGNING_MODE: ${{ needs.release-policy.outputs.mac-signing-mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require a development version
        run: node -e "if (!require('./desktop/package.json').version.includes('-')) throw new Error('Desktop previews require a prerelease version')"
      - name: Test the shared core and desktop
        env:
          TMPDIR: /tmp
          MAC_SIGNING_MODE: ad-hoc
        run: |
          npm test
          npm --prefix desktop test
      - name: Install the desktop toolchain
        run: npm ci --prefix desktop
      - name: Verify beta updater compatibility on every platform
        run: node --test desktop/updater-preview.test.cjs
      - name: Install the rpm build tool
        if: matrix.platform == 'linux'
        # electron-builder makes the .rpm with rpmbuild, which an Ubuntu runner does not carry.
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Package the native preview
        if: matrix.platform != 'darwin' || needs.release-policy.outputs.mac-signing-mode != 'signed'
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          PREVIEW_BUILD: ${{ github.run_number }}
          # Apply the Mac ad-hoc identity on PRs too. No certificate or signing secrets.
          CSC_FOR_PULL_REQUEST: 'true'
        run: npx electron-builder --config preview.config.cjs --${{ matrix.target }} --${{ matrix.arch }} --publish never
      - name: Sign and notarize the Mac preview
        if: matrix.platform == 'darwin' && needs.release-policy.outputs.mac-signing-mode == 'signed'
        working-directory: desktop
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder --config preview.config.cjs --mac --${{ matrix.arch }} --publish never
      - name: Verify the packaged app
        # Structure verification does not need signing credentials or signed config evaluation.
        run: MAC_SIGNING_MODE=ad-hoc node desktop/verify-build.mjs "${{ matrix.app }}" --platform=${{ matrix.platform }} --config=desktop/preview.config.cjs
      - name: Verify Mac signing and notarization
        if: matrix.platform == 'darwin'
        env:
          APPLE_TEAM_ID: ${{ needs.release-policy.outputs.mac-signing-mode == 'signed' && secrets.APPLE_TEAM_ID || '' }}
        run: node desktop/verify-mac-signing.cjs "${{ matrix.app }}"
      - name: Supply both Windows updater feed names
        if: matrix.platform == 'win32'
        run: node -e "require('fs').copyFileSync('desktop/dist/latest.yml', 'desktop/dist/beta.yml')"
      - name: Supply both Linux updater feed names
        if: matrix.platform == 'linux'
        # The feed is named for the architecture: latest-linux.yml on x64, latest-linux-arm64.yml on arm64.
        # A block, not a one-line value: the command has a colon followed by a space in it, which
        # YAML reads as the start of a key.
        run: |
          suffix=""
          if [ "${{ matrix.arch }}" != "x64" ]; then suffix="-${{ matrix.arch }}"; fi
          cp "desktop/dist/latest-linux${suffix}.yml" "desktop/dist/beta-linux${suffix}.yml"
      - name: Install the package the way a user would
        if: matrix.platform == 'linux'
        # apt resolves the declared dependencies and runs the package's own postinst, which is what
        # installs the AppArmor profile. Opening /opt/SpawnLoft afterwards is therefore the test a
        # real Ubuntu 24.04 desktop would give it, sandbox included - not a folder run in place.
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb ./desktop/dist/SpawnLoft-*-linux-${{ matrix.deb }}.deb
          test -x /usr/bin/spawnloft && test -x /opt/SpawnLoft/spawnloft-desktop
          # Both packages are made from one folder, one after the other; each must say what it is,
          # because that marker is how the updater decides between the .deb and the .rpm.
          test "$(cat /opt/SpawnLoft/resources/package-type)" = deb
          /usr/bin/spawnloft config
      - name: Install the rpm on Fedora the way a user would
        if: matrix.platform == 'linux'
        # The .deb and the .rpm carry the same app, so the window is exercised once, from the .deb
        # above. What differs is the packaging: the dependencies the rpm declares, its install
        # script, and the marker that tells the updater which kind of install this is. dnf on a
        # real Fedora answers all three, and the bundled CLI proves the runtime loads there.
        run: |
          docker run --rm -v "$PWD/desktop/dist:/pkg:ro" fedora:42 bash -ec '
            dnf install -y /pkg/SpawnLoft-*-linux-*.rpm
            rpm -q spawnloft
            test -x /opt/SpawnLoft/spawnloft-desktop && test -x /usr/bin/spawnloft
            test "$(cat /opt/SpawnLoft/resources/package-type)" = rpm
            spawnloft config
          '
      - name: Build the command-line packages
        if: matrix.platform == 'linux'
        # The core on a Node of its own, for a machine with no screen: no Electron, and none of the
        # graphical libraries the desktop package pulls in. Same version and commit as the app above.
        run: node desktop/build-cli-package.mjs
      - name: Install the command-line packages where there is no Node, and run a server
        if: matrix.platform == 'linux'
        # The oldest Debian-family and RHEL-family releases the package claims to support, and a
        # current one of each. None of these images has Node, which is what the package promises
        # not to need; what each run proves is written at the top of the script.
        run: |
          docker run --rm -v "$PWD:/repo:ro" ubuntu:22.04 sh /repo/desktop/smoke-cli-package.sh deb
          # "db": on x64, also install managed MySQL as an ordinary user on a system with none of the
          # libraries it needs. apt-get download on Debian, dnf 4 on Rocky, dnf 5 on Fedora.
          docker run --rm -v "$PWD:/repo:ro" debian:12 sh /repo/desktop/smoke-cli-package.sh deb db
          for image in rockylinux:9 fedora:42; do
            docker run --rm -v "$PWD:/repo:ro" "$image" sh /repo/desktop/smoke-cli-package.sh rpm db
          done
      - name: Install the isolated UI test tool
        run: npm install --prefix "$RUNNER_TEMP/desktop-smoke" --no-save --no-package-lock playwright@1.63.0
      - name: Open the packaged app and exercise the shared regressions
        env:
          NODE_PATH: ${{ runner.temp }}/desktop-smoke/node_modules
        run: ${{ matrix.wrap }} node desktop/smoke-desktop.cjs "${{ matrix.smoke }}" "desktop/dist/smoke-${{ matrix.platform }}-${{ matrix.arch }}"
      - name: Record platform, source, and checksums
        if: success()
        run: node desktop/preview-artifacts.mjs ${{ matrix.platform }} ${{ matrix.arch }}
      - name: Verify a signed installed Mac upgrade
        if: matrix.platform == 'darwin' && needs.release-policy.outputs.mac-signing-mode == 'signed'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NODE_PATH: ${{ runner.temp }}/desktop-smoke/node_modules
        run: node desktop/smoke-mac-update.cjs "${{ matrix.app }}"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-preview-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            desktop/dist/SpawnLoft-*.exe
            desktop/dist/SpawnLoft-*.exe.blockmap
            desktop/dist/latest.yml
            desktop/dist/beta.yml
            desktop/dist/SpawnLoft-*-mac-${{ matrix.arch }}.dmg
            desktop/dist/SpawnLoft-*-mac-${{ matrix.arch }}.zip
            desktop/dist/SpawnLoft-*-linux-*.deb
            desktop/dist/SpawnLoft-*-linux-*.rpm
            desktop/dist/spawnloft-cli-*.deb
            desktop/dist/spawnloft-cli-*.rpm
            desktop/dist/latest-linux*.yml
            desktop/dist/beta-linux*.yml
            desktop/dist/preview-build-${{ matrix.platform }}-${{ matrix.arch }}.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-smoke-${{ matrix.platform }}-${{ matrix.arch }}
          path: desktop/dist/smoke-${{ matrix.platform }}-${{ matrix.arch }}/

  publish:
    needs: [release-policy, build]
    if: github.ref == 'refs/heads/dev' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-preview-*
          path: desktop/dist/preview-release
          merge-multiple: true
      - name: Publish all platforms as one complete development release
        env:
          GH_TOKEN: ${{ github.token }}
          MAC_SIGNING_MODE: ${{ needs.release-policy.outputs.mac-signing-mode }}
        run: node desktop/publish-preview.mjs
