# Sets mod loaders up for real (tools/real-loader-install.mjs): each installer downloaded and
# checked, its build steps run on Mojang's Java, every output checked, and the launch command
# built with every file it names on disk. It stops before the game would start; no job can show a
# game window. Runs on pull requests that change the loaders' code, weekly, and by hand.
#
# The profiles are set up by the Rust core's client (spawnloft-core, rust/PLAN-CORE-PORT.md C7b);
# the checks read what it wrote on disk: the stamp, a second setup, the libraries.
name: loader-install

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'
  pull_request:
    paths:
      - rust/crates/spawnloft-lib/src/client/**
      - rust/crates/spawnloft-core/src/port/client.rs
      - rust/crates/spawnloft-lib/src/zip.rs
      - rust/crates/spawnloft-lib/src/download.rs
      - rust/crates/spawnloft-lib/src/download/**
      - rust/crates/spawnloft-lib/src/java.rs
      - tools/real-loader-install.mjs
      - .github/workflows/loader-install.yml

permissions:
  contents: read

concurrency:
  group: loader-install-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { loader: neoforge, mc: '26.3', build: '26.3.0.103' }
          - { loader: neoforge, mc: '1.21.1', build: '21.1.266', and: '21.1.265' }
          - { loader: forge, mc: '26.3', build: '66.1.8' }
          - { loader: forge, mc: '1.20.1', build: '47.4.28', and: '47.4.29' }
          - { loader: forge, mc: '1.16.5', build: '36.2.34' }
          - { loader: forge, mc: '1.12.2', build: '14.23.5.2859', and: '14.23.0.2486' }
          - { loader: forge, mc: '1.7.10', build: '10.13.4.1614-1.7.10' }
          - { loader: forge, mc: '1.6.4', build: '9.11.1.1345' }
    name: ${{ matrix.loader }} ${{ matrix.build }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      # the check job's cache from v2 (rust-internal.yml), restored only: this workflow saves none
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-check-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}-${{ github.run_id }}
          restore-keys: rust-check-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}-
      - name: Build spawnloft-core
        working-directory: rust
        run: |
          rustup toolchain install
          cargo build -p spawnloft-core --locked
      - name: Set ${{ matrix.loader }} ${{ matrix.build }} up for Minecraft ${{ matrix.mc }}
        run: node tools/real-loader-install.mjs --loader ${{ matrix.loader }} --mc ${{ matrix.mc }} --build ${{ matrix.build }} ${{ matrix.and && format('--and {0}', matrix.and) || '' }} --core rust/target/debug/spawnloft-core
