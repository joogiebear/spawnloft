# Shapes the list GitHub appends to every release under the hand-written notes: each merged
# pull request with its author, grouped by label, and a "New Contributors" line for first-timers.
# It is what "Generate release notes" on GitHub uses; the published releases carry hand-written notes.
changelog:
  exclude:
    labels:
      - release
  categories:
    - title: New
      labels:
        - enhancement
        - feature
    - title: Fixed
      labels:
        - bug
        - fix
    - title: Everything else
      labels:
        - "*"
